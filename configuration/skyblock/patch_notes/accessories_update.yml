title: "The Accessories Update"
date: "8th October 2026"
intro:
  - "Every accessory from SkyBlock is here, and your Accessory Bag finally pulls its weight. Accessory stats now really apply, Magical Power is now Accessory Power, and Powers have arrived."
  - "Accessories whose effects need places that aren't built yet are already in the game. Those effects say Not active yet."
sections:
  - heading: "Accessory Bag"
    colour: "<5>"
    lines:
      - "Accessory stats now actually work from your Accessory Bag and inventory."
      - "Only the highest tier of each upgrade line counts, and duplicates never stack."
      - "Magical Power is now called Accessory Power, and every accessory shows how much it gives."
      - "The Accessory Bag starts with 9 slots. Redstone Collection tiers II to IX add 6 each, and the Accessory Size attribute adds more."
      - "Fixed items duplicating or vanishing when changing Accessory Bag pages."
      - "The Accessory Bag SkyBlock XP task now pays 1 XP for every Accessory Power you have."
      - "Accessories worn in armor slots no longer count as inventory accessories."
  - heading: "Recombobulation"
    colour: "<6>"
    lines:
      - "Added the Recombobulator 3000, usable in the Anvil."
      - "Recombobulating an accessory now raises its rarity, Accessory Power and SkyBlock XP."
      - "The Hegemony Artifact counts for double Accessory Power."
      - "Abicases give +1 Accessory Power for every 2 Abiphone contacts."
  - heading: "Powers"
    colour: "<d>"
    lines:
      - "Maxwell the Thaumaturgist can now give your Accessory Bag a Power! Choose from 10 default powers, or learn 22 more from Power Stones."
      - "Power stats scale with your Accessory Power. Stone powers also give a flat Unique Power Bonus."
      - "Combine 9 identical Power Stones at Maxwell to learn a power for good, for +15 SkyBlock XP each."
      - "The Power Stones Guide at Maxwell shows every stone and where to find it."
      - "Added all 22 Power Stones. Furball drops from Sven Packmaster Tier III and above, and Hazmat Enderman from Voidgloom Seraph Tier III and above."
      - "The Acacia Birdhouse, Obsidian Tablet and Horns of Torment recipes unlock at Acacia IX, Obsidian IX and Raw Mutton IX."
  - heading: "Stats Tuning"
    colour: "<9>"
    lines:
      - "Every 10 Accessory Power gives 1 Tuning Point to spend on Health, Defense, Speed, Strength, Crit Damage, Crit Chance, Attack Speed or Intelligence."
      - "Save and load up to 4 Tuning Templates. The first is free; the others cost 10,000 Bits each."
  - heading: "Enrichments"
    colour: "<3>"
    lines:
      - "Enrichments now work! Combine one with a Legendary or better accessory in an Anvil to add its stat."
      - "The Accessory Enrichment Swapper changes the enrichment on every enriched accessory in your Accessory Bag."
  - heading: "New Accessories"
    colour: "<a>"
    lines:
      - "Added all 55 Hatcessories: Crab, Sloth, Anniversary Balloon and Cake Hats. Each gives +1 Magic Find in your bag, and only one counts."
      - "Wear a Hatcessory for Party Time: +1 Intelligence for each SkyBlock year your profile has existed."
      - "Added the Sunshine Crystal, the Day Crystal's upgrade: +10 Strength and +10 Defense during the day."
      - "Added the Tarantula, Witch, Hotspot, Gratitude, Accretion, Organ Donor and Trophy Fish lines, all ten Rings of Love, and many more."
      - "Added the Speed Relic, Moonlight Crystal, Bait Ring, Spiked Atrocity, IQ Points, Gravity Talisman, Magic 8 Ball, Pulse Ring, the Powder line, the Freshly Baked line and the Crux line up to the Celestial Starstone."
  - heading: "Accessory Effects"
    colour: "<c>"
    lines:
      - "Tarantula Talisman and Ring: every 10th melee hit on the same enemy deals +10% or +15% damage."
      - "Rings of Love: a chance on each hit to deal double damage, from 1 in a trillion up to 1 in 100."
      - "Devour Ring heals 10 Health when you kill Undead mobs, and the Reaper Orb grants 2 Strength for each mob killed in the last 5 seconds."
      - "The Night Vision Charm grants Night Vision, and the Experience Artifact gives +25% experience orbs."
      - "The Hotspot line boosts Fishing Speed, Sea Creature Chance and Treasure Chance while fishing in a Hotspot."
      - "The Potato Ring speeds up your Potato minions and the King Talisman adds HOTM XP to commissions."
      - "Damage reduction accessories now work: the Zombie, Spider, Wolf, Ender, Wither, Sea Creature, Blaze and Skeleton lines and the Nether Artifact."
      - "Day and Night Crystals, Moonlight Crystal, Glacial, Junk and Kuudra Core accessories grant their stats where and when they should."
      - "Campfire badges work while you burn, Feather accessories soften falls, and Runeblades boost axes against Woodland mobs."
      - "Potion Affinity extends potions, Haste accessories add Mining Speed, IQ Points boost Intelligence and the Gravity Talisman rewards staying near spawn."
      - "Emerald accessories pay coins every minute, Scavenger adds coins per mob level and the Bits Talisman can double your bits."
      - "Piggy Banks protect your coins when you die, cracking and then breaking as they do on Hypixel."
      - "Bait Ring and Spiked Atrocity can save your bait, the Powder line adds Mithril Powder and Chocolate accessories add Chocolate per second."
      - "Every accessory shows its current tooltip. Effects that need content we don't have yet say Not active yet."
  - heading: "Drops and Sources"
    colour: "<e>"
    lines:
      - "Water Hydras can drop the Fish Affinity Talisman."
      - "Tarantula Broodfather III to V can drop the Tarantula Talisman, and Voidgloom Seraph IV the Handy Blood Chalice."
      - "Tarantula Broodfather and Voidgloom Seraph token drops now match Hypixel's amounts."
      - "Devour Ring, Reaper Orb and Tarantula Ring recipes unlock from Slayer levels."
      - "Magnetic Talisman, Experience Artifact, Night Vision Charm, Hotspot and Sunshine Crystal recipes unlock from collections."
      - "Gustave rewards the Wolf Paw for finishing the Woods Race in 32 seconds."
      - "The Hocus-Pocus Cipher and Magic 8 Ball can appear in the Dark Auction, and Voidgloom Seraph IV can drop the Pocket Espresso Machine."
      - "Farmer Orb, Gravity Talisman, Bait Ring, Moonlight Crystal and Wood Affinity Talisman recipes unlock from collections."
  - heading: "Fixes"
    colour: "<c>"
    lines:
      - "Fixed the rarities and stats of many accessories, including the Abicases, Scarf's line, the Farming, Mine Affinity and Village Affinity Talismans, and the Healing, Respiration, Emperor's, Seal, Fermento and Kuudra accessories."
      - "The ITEM IS NOT FINISHED banner is gone from every accessory."
