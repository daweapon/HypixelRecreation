title: "The Torrhus Canyon Update"
date: "20th October 2026"
intro:
  - "The second island of Galatea is here: Torrhus Canyon, home of Helia and Miria, with Helix trees and Desert Whispers."
sections:
  - heading: "Torrhus Canyon"
    colour: "<6>"
    lines:
      - "Reach it from the launch pad at the back of Moonglade Marsh (Foraging XII and Heart of the Forest Tier 4), or with /warp torrhus. Helix trees give Helix Logs, Desert Whispers and Tree Gifts."
      - "Talk to Helia for the Torrhus Chapters, then head down the Spring Path to find Miria."
  - heading: "Honeyhives and Ruby Veilshrooms"
    colour: "<6>"
    lines:
      - "Right-click a Honeyhive for 16 to 64 Honeycomb plus coins, Enchanted Honeycomb or a Honeybuzz or Queen Bee Shard. Each hive refills after 60 minutes."
      - "Ruby Veilshrooms grow in the Springs caves. Each one gives 4 Ruby Veilshrooms and Desert Whispers, and grows back after about a minute."
  - heading: "Desert Whispers"
    colour: "<6>"
    lines:
      - "Heart of the Forest perks from Tier 4 to Tier 8 and Center of the Forest levels 4 and 5 now cost Desert Whispers."
      - "Cut Helix Logs, open Helix Tree Gifts and place in Miria's Contest to earn them. Daily Wishes pays Desert Whispers for your first Helix Log of the day."
      - "Forest Whispers above 12,500,000 are converted to Desert Whispers one to one the first time you log in."
  - heading: "Miria's Contest"
    colour: "<d>"
    lines:
      - "Miria hosts a Starlyn Contest every SkyBlock Day. Reach Uncommon or better for a Safari Ticket."
      - "Spend Miria's Coupons in her shop: Miria's Power, Helix Fortune, Personal Bests, a Sloth pet, talismans, shards and books."
      - "Two-for-one gives a chance at a second Safari Ticket."
  - heading: "Sidebar and zones"
    colour: "<e>"
    lines:
      - "While you take part in Agatha's or Miria's Contest the sidebar shows the time left, your bracket and what the next bracket needs."
      - "Whispers you earn appear on the sidebar, and every Torrhus zone shows its New Area Discovered tips the first time you enter it."
  - heading: "Torrhus Fishing"
    colour: "<3>"
    lines:
      - "Fish in the Torrhus Springs (Fishing 15) for Haggard, Brineling, Sprawl, Torrid, Silkbreeze and the Giant Isopod. They drop Helix Logs, Ruby Veilshrooms and their enchanted forms, plus Sea Brine, Helixis, Veilshroom Bunches and more."
      - "Torrhus treasure holds Enchanted Ruby Veilshrooms, Enchanted Helix Logs, Helixis and the Stingray, Sepialot, Ember, Water Snake, Solar and Goldolot Shards. Caught shards go straight to your Hunting Box."
      - "The Hotspot Haven hotspot turns Great catches into a Giant Water Bug Shard and Outstanding catches into 4 to 8, boosted by Hunter Fortune."
      - "The six Catch tasks in Torrhus Chapters now work, and the creatures have Bestiary and Sea Creature Guide entries."
  - heading: "Moonglade Marsh Fishing"
    colour: "<2>"
    lines:
      - "Fish in the water of Moonglade Marsh on Galatea for Bogged (Fishing 5), Wetwing (7), Tadgang (9), Ent (12), The Loch Emperor (20) and Nessie (25). They drop Sea Lumies, Mangrove Logs, their enchanted forms, Gill Membranes, Wet Water, Mangcore and more."
      - "Lava fishing in Moonglade Marsh (Fishing 17) can now catch a Stridersurfer, which drops Gill Membranes and Sturdy Bones."
      - "Moonglade Marsh treasure holds Fig and Mangrove Logs, coins and the Verdant, Cod, Azure, Piranha, Salmon and Eel Shards. Caught shards go straight to your Hunting Box."
      - "The Loch Emperor can drop the Flying Fish pet. The Wetwing task in the Moonglade Marsh chapters now works, and every creature has Bestiary and Sea Creature Guide entries."
  - heading: "Collections, Scrolls and Fairy Souls"
    colour: "<a>"
    lines:
      - "The Helix Log and Ruby Veilshroom Collections are here. Helix Log I unlocks the Travel Scroll to Torrhus Canyon and Ruby Veilshroom I the Travel Scroll to Torrhus Springs. Helix Log IX raises your Foraging level cap by one."
      - "Twelve Fairy Souls are hidden around Torrhus Canyon, and they show up in the Fairy Souls Guide."
      - "Fig Log IX and Mangrove Log IX now also pay their Foraging XP."
  - heading: "Hunting on Galatea and Torrhus"
    colour: "<e>"
    lines:
      - "Critters now roam Moonglade Marsh and Torrhus Canyon, along with Tikis, Ants, Parched and the Chill and Drowned mobs. Critters ignore normal hits: use the tool for the job."
      - "Lassos (Abysmal to Everstretch) catch forest critters: throw, wait until the stamina bar runs low, then reel in once per bar. Fishing Nets catch swimming critters, and a Huntaxe plus a Pocket Black Hole captures combat creatures. Every catch gives the creature's Attribute Shard and Hunting XP."
      - "Fig, Mangrove and Helix trees give critters too: cut them for Phanpyre, Phanflare, Dreadwing, Firefox, Puck and more, or lather a tree with a Pot of Honeycomb (Fun-Sized, Family-Sized, Jumbo, Behemoth) to attract a Honey critter. The Honeycomb Collection unlocks the pots."
      - "Honeyhives can release an angry Honeybuzz, the Beeheemoth appears every ten minutes or so around the Torrhus Springs, and Monster Hunter now pays Forest Whispers on the Moonglade Marsh."
      - "The Moonglade Marsh and Torrhus Canyon have their own Bestiary sections."
  - heading: "Hunters, Shops and the Beacon"
    colour: "<6>"
    lines:
      - "Auryon hands out the Abysmal Lasso and Jaeger the Basic Fishing Net. Albert sells Gravity Condensers, Kiara and Sanger sell Elusive and Reptile Shards, Freddy sells hunting hints, Ant sells the Tier XII Generator Upgrade Stones and Maxim sells Booster Upgrades. Alan, Amaury, Nemo and Sawyer have their shops, and Dax gives a free Small Huntrap."
      - "Boosters can be applied in the Anvil to Axes, Armor and Equipment: Sweep, Foraging Fortune, Foraging Wisdom, Hunting Wisdom and Fighting, in common and uncommon form."
      - "Tune the Moonglade Beacon next to Boris for stacks of Fig and Mangrove Fortune that last 20 minutes island-wide, and use a Signal Enhancer to improve it. Tuning can find a Beaconmite Shard."
      - "Brian runs the Trial of Blue Flames: stand in the soul campfire to start a trial and earn Soul Campfire badges. Swoop now tracks tree milestones and pays Sweep and Foraging XP."
  - heading: "Fish the Fish and the Desert Temple"
    colour: "<b>"
    lines:
      - "Fish the Fish, Swamp the Fish and Mob the Fish are very rare catches and drops, and the Tomb Floodway on the Moonglade Marsh can give a Flexbone."
      - "Solve the Desert Temple button puzzle and the statue puzzle on Torrhus Canyon to activate the Starborn Temple."
  - heading: "Torrhus Chapters"
    colour: "<2>"
    lines:
      - "Seven chapters of tasks from Helia. Tasks for content that does not exist yet are marked Not available yet and do not hold a chapter back."
