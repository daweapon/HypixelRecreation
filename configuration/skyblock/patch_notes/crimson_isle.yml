title: "The Crimson Isle Update"
date: "8th October 2026"
intro:
  - "The Crimson Isle is open! Pick a side in the war between the Mages and the Barbarians, train at the Dojo, fish the lava for Trophy Fish and take on the isle's bosses."
  - "Kuudra stirs beneath the isle, but isn't ready to be fought just yet."
sections:
  - heading: "Getting There"
    colour: "<6>"
    lines:
      - "Warp with /warp nether or Fast Travel. Requires Combat XXII and the Travel Scroll to the Crimson Isle, unlocked at Glowstone Dust Collection IV."
      - "New Crimson Isle Warps: Forgotten Skull, The Wasteland, Dragontail, Scarleton and Smoldering Tomb."
      - "All 43 areas can be discovered, each with its own tips."
      - "The tab list shows your Reputation, Faction Quests, Trophy Fish and the Volcano."
  - heading: "Factions"
    colour: "<5>"
    lines:
      - "Meet Elle in the Stronghold, help with her errands, get to know both towns and choose the Mage or Barbarian Faction."
      - "Complete the Mage questline for +600 Reputation, or the Barbarian questline for +900 Reputation and 200,000 coins."
      - "Switch factions for free at Elle. Both reputations are kept and can no longer go below 0."
      - "Reach Friendly, Trusted, Honored and Hero for SkyBlock XP and up to 20% off at the Emissaries."
      - "Faction shops: both Emissaries, An, Ulyn, Ezekiel, Grog, Lys, and Hilda and Marthos with Tier XII minions."
      - "Earn extra Reputation by helping Rollim, Kaus, Pablo, Avorius, Mollim, Pomtair, Sirih, Suus and Igrupan."
      - "The Throne Room is for Mages only."
  - heading: "Faction Quests"
    colour: "<2>"
    lines:
      - "The Town Boards in Scarleton and Dragontail post 5 quests every day, resetting at midnight UTC."
      - "Catch Trophy Fish, fetch materials, slay minibosses, rescue hostages, pass Dojo tests or defeat Kuudra."
      - "Quests get harder, and pay more, as your Reputation grows."
      - "Rescue Missions: sneak past the guards of the enemy stronghold. Guards watch and listen, and bells distract them!"
  - heading: "The Dojo"
    colour: "<6>"
    lines:
      - "Master Tao teaches seven challenges: Force, Stamina, Mastery, Discipline, Swiftness, Control and Tenacity."
      - "Each challenge is graded from F to S. Reach a D to unlock the next one."
      - "Dojo Points unlock the Yellow, Green, Blue, Brown and Black Belts, with up to 160,000 Combat XP each."
      - "Belts reduce the damage you take by up to 6%."
  - heading: "Mobs and Bosses"
    colour: "<4>"
    lines:
      - "32 kinds of mob now roam the isle, from Blazes and Wither Spectres to Flaming Spiders, Ghasts, Kada Knights, Barbarians and Fire Mages."
      - "Blazes come out at night, and Ghasts in the evening."
      - "Killing faction members costs Reputation, and the guards don't take kindly to the rival faction."
      - "Corrupted mobs appear more often during eruptions, Vanquishers rise from Crimson Isle kills, and eruptions bring Matchos."
      - "Fight Bladesoul, the Mage Outlaw, Barbarian Duke X, Ashfang and the Magma Boss. The first kill of each every day gives +20 Reputation."
      - "The Matriarch swallows adventurers whole. Collect up to 3 Heavy Pearls a day from her belly."
      - "Added the Crimson Isle Bestiary."
  - heading: "Blaze Slayer"
    colour: "<6>"
    lines:
      - "The Inferno Demonlord has been rebuilt with the Hellion Shield, demonsplits, Fire Pillars and fire pits."
      - "Only Blaze-family kills progress the quest."
      - "Added the full drop table, the RNG Meter, a Boss Drops preview, all nine level rewards, slayer minibosses and the attunement daggers."
      - "All Slayer levels now grant SkyBlock XP."
  - heading: "Trophy Fishing"
    colour: "<3>"
    lines:
      - "Odger has opened his hut on top of the volcano. Visit him for a free Starter Lava Rod!"
      - "Catch all 18 Trophy Fish, fillet them into Magmafish and claim Trophy Fisher rank rewards."
      - "A Trophy Fish only bites when no Sea Creature does."
      - "The Golden Fish surfaces after 8 minutes of fishing."
      - "Added 16 lava Sea Creatures, including Thunder, Lord Jawbus, Ragnarok and the Plhlegblast."
      - "Talk to Hattie to see fishing hotspots."
      - "Added Hunter, Thunder and Magma Lord Armor."
  - heading: "Items and Economy"
    colour: "<1>"
    lines:
      - "Added more than 110 Crimson Isle items, 4 pets and 7 reforges, including Blaze, Rampart, Berserker, Shimmering Light and Rekindled Ember Armor."
      - "Fire Veil, Fire Freeze, Fire Fury and Ragnarock abilities now work."
      - "Added the Mycelium and Red Sand Minions, gated by faction Reputation."
      - "Added the Inferno Minion and the Gabagool fuel chain."
      - "Vulcan's Crimson Essence Shop is open. Igor and Alwin upgrade items with essence stars and salvage gear."
      - "Mycelium, Red Sand, Glowstone, Quartz and Netherrack can be gathered on the isle, and eruptions scatter Sulphur Ore."
  - heading: "Kuudra"
    colour: "<4>"
    lines:
      - "Crag in the Forgotten Skull shows what each Kuudra tier requires."
      - "Kuudra Keys are sold by the Emissaries and can be crafted into higher tiers."
      - "Rumour has it that true followers of Kuudra can earn a hidden armor set..."
      - "The fight against Kuudra itself is coming in a future update."
  - heading: "Towns"
    colour: "<5>"
    lines:
      - "Scarleton and Dragontail each have a Bank, an Auction House and a Bazaar."
      - "Udel sells every Abiphone, and Nuvian runs a secret shop behind a keypad."
      - "Carrolyn exports crops for permanent stats, and Bruuh charges a toll for his house."
  - heading: "Bug Fixes"
    colour: "<8>"
    lines:
      - "Every minion now works, including Blaze, Magma Cube, Ghast, Nether Wart and the crop minions."
      - "Zombie, Cow, Pig, Chicken, Sheep and Rabbit Minions now collect their drops."
      - "A broken minion no longer stops every other minion on your island."
      - "Fixed a crash when a mob hit a player with Wither Shield active."
      - "Charming now works on every mob with a Hunting shard."
      - "The Taurus Helmet, Moogma Leggings, Magma Lord Armor and Enchanted Ancient Claw now exist."
