title: "The Park Update"
date: "20th October 2026"
intro:
  - "Romero and Juliette finally have their love story, and wolves haunt the Howling Cave."
sections:
  - heading: "Romero and Juliette"
    colour: "<e>"
    lines:
      - "Talk to Juliette on the Jungle Island (Combat 22 needed) and then find Romero in ten places across SkyBlock. Bring him what he asks for, then bring his gift back to Juliette."
      - "Each step upgrades your Ring of Love, from the Shiny Yellow Rock up to the Legendary Ring of Love, and finishing the quest earns the Friar Lawrence achievement."
      - "Mine the gold ore in the Savanna Woodland cave without Silk Touch to find a Yellow Rock."
      - "Cheap, Decent and Black Coffee now work as a potion base, so you can brew the Rabbit VI potion Romero wants."
      - "If you lose Romero's gift, click the message he sends and pay 100,000 coins. Rusty sells back your Ring of Love for 1,000,000 coins."
      - "Romero now visits your Garden once the quest is done."
  - heading: "Howling Cave"
    colour: "<a>"
    lines:
      - "Pack Spirits, Howling Spirits and Soul of the Alpha prowl the cave under the Dark Thicket. Souls of the Alpha always appear together."
      - "They drop logs, Travel Scrolls to the Howling Cave, Hound Pets, Weak Wolf Catalysts and Foraging Exp Boosts, fill the Bestiary and give Howling Spirit and Soul of the Alpha shards."
  - heading: "Not here yet"
    colour: "<c>"
    lines:
      - "Wolf Slayer progress from the cave wolves, and the Soul Cave and Spirit Cave."
