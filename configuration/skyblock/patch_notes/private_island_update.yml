title: "The Private Island Update"
date: "21st October 2026"
intro:
  - "Your island is now yours to build on. The first part of the Private Island update lets you place portals."
sections:
  - heading: "Island Portals"
    colour: "<b>"
    lines:
      - "Place a portal item on a block of your island. The portal appears on top of that block, facing you, and needs a clear space 9 blocks wide, 5 deep and 15 tall."
      - "Walk into the portal to travel. Destinations still check your skill requirements, for example Mining 12 for the Dwarven Mines."
      - "Right-click the frame of a portal to delete it. You do not get it back."
      - "All 38 portal items can be placed now. Portals to Lotus Atoll and The Rift are placeable but wait for those islands to open."
      - "Your starter Hub portal is now a normal portal, so it can be deleted too. Portals are saved with your island."
  - heading: "Beacons"
    colour: "<b>"
    lines:
      - "Place one Beacon on your island and right-click it to open the Beacon menu. Breaking the Beacon gives it back, but the Power Crystals inside are lost."
      - "Feed the Beacon Power Crystals or Scorched Power Crystals from the Beacon Power slot, or right-click the Beacon while holding one. Each crystal adds 48 hours and they stack."
      - "Minion Buff speeds up every minion on your island by 2% per Beacon tier. Beacon Effect gives everyone on your island potion effects and bonus stats."
      - "Profile Stats grants one stat everywhere in SkyBlock, growing with the Beacon tier. A Scorched Power Crystal adds 20% to that stat and 1% to the minion buff."
  - heading: "Biomes and Flight"
    colour: "<b>"
    lines:
      - "All twelve Biome Sticks work now. Right-click a block to change the biome around it, or left-click to change the radius from 1 to 5. Birch Forest, Deep Ocean, Desert, End, Forest, Taiga, Mesa, Mushroom and Nether join Jungle, Roofed Forest and Savanna."
      - "Talk to Jerry and pick Change Island Biome to change the biome of your whole island, or set it back to Plains."
      - "Magical Mushroom Soup gives 2 minutes of flight and Mystical Mushroom Soup gives 200 minutes on your Private Island and in the Garden. Soup flight pauses while you are elsewhere, stacks when you drink more, and protects you from fall damage."
      - "A Booster Cookie now gives permanent flight on your island and in the Garden."
  - heading: "Teleport Pads"
    colour: "<b>"
    lines:
      - "Teleport Pads can now be placed on your private island, up to 56 of them. Trade an Enchanted Eye of Ender for 2 pads."
      - "Step onto a pad to travel to the pad you chose as its destination. Right-click a pad to open its settings: destination, the direction you face on arrival, icon, name and pick up."
      - "Only members of the island can change a pad, but anyone can use one."
  - heading: "Portalizer"
    colour: "<b>"
    lines:
      - "Combine a Portalizer with a Travel Scroll in an Anvil to turn the scroll into the matching portal item."
  - heading: "Training Dummies"
    colour: "<b>"
    lines:
      - "Place up to 4 Training Dummies on your island, at least 5 blocks apart. Hit one to see its damage per second."
      - "Right-click a dummy to change the mob it looks like or to pick it up. Dummies cannot be killed."
  - heading: "Furniture and the Carpentry Table"
    colour: "<6>"
    lines:
      - "Furniture can now be placed on your island. Place it where you click, facing you. You can have 15 pieces at once, and each piece needs a Carpentry level to place."
      - "Carpentry Table: craft one from 10 Oak Planks, 2 Crafting Tables and 4 Sticks, place it, then right-click it. It lists every furniture recipe your Carpentry level has unlocked. Crafting furniture gives Carpentry XP. From Carpentry 3, VIP players can shift-click for Quick Crafting."
      - "Sneak and right-click furniture to rotate it by 45 degrees or pick it up. Chairs, stools and benches seat you, Hay Bed and Large Bed set your island spawn, the Fire Pit toggles its flames, and the Minion Chair shows off one minion without using a minion slot."
      - "Talk to the Carpenter once you have finished his quest to open the Furniture Shop: Scarecrow 120, Weapon Rack 100, Armor Stand 100, Flower Pot 150, Enchanting Table+ and Crafting Table+ 10,000 each, Furnace+ and Wood Chest+ 15,000 each, and more."
      - "Reward Bundle and event furniture is still on its way. Storage, crafting and enchanting furniture work as decoration for now apart from Crafting Table+, Enchanting Table+ and Blacksmith+, which open their menus."
