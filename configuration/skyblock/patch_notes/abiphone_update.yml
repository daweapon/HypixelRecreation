title: "The Abiphone Update"
date: "23rd October 2026"
intro:
  - "The Abiphone gets a Contacts Directory listing all 85 contacts, a working sort button, Do Not Disturb, /call, Speed Dial, Snake, Tic Tac Toe and Ringtones."
sections:
  - heading: "Contacts Directory"
    colour: "<a>"
    lines:
      - "Open it from the book in your Abiphone. It lists all 85 contacts with their description, difficulty, usual location and what they need to become a contact. Contacts that are not in the game yet say so."
      - "Sort by A to Z, Z to A, Difficulty or Usual Location, filter by All Contacts, Not Added or Completed Quest but Not Added, and search by name with the sign. Right-click a button to go backwards."
  - heading: "Abiphone"
    colour: "<b>"
    lines:
      - "The Sort button now sorts your contacts by First Added, Alphabetical, Last Called, Most Called or Do Not Disturb First."
      - "Abiphone XII and above can set Do Not Disturb on a contact from the contact's management menu."
      - "Abiphone X Blue is now Uncommon and Abiphone XIII Sapphire holds 15 music discs, like Hypixel."
      - "Use /call followed by a contact name, such as /call alda, to ring any contact on one of your Abiphones without opening it."
      - "Abiphone Flip+ models can set one Speed Dial contact from the contact's management menu, then left-click the Abiphone to call them."
      - "Abiphone XIII and above include Snake, Abiphone XIV and above Tic Tac Toe against an unbeatable Abiphone, and Abiphone Flip models Ringtones. Your best Snake score and Tic Tac Toe results are kept on the phone."
      - "The Sumsung G3 and GG Abicases add one and two contact slots, and the Rezar Abicase makes calls ring once."
      - "Walter now accepts an Enchanted Sulphur Cube once you reach Sulphur Collection VII, and opens his shop when you call him."
  - heading: "New Contacts"
    colour: "<d>"
    lines:
      - "31 more NPCs are now contacts: Alchemist, Anita, Bartender, Blacksmith, Brynmor, Bulvar, Einary, Fann, Fear Mongerer, Feast Chef Ted, Gemma, Geo, Jacob, Jax, Jotraeline Greatforge, Junker Joel, Kat, Lumber Merchant, Mad Redstone Engineer, Maddox the Slayer, Malik, Maxwell, Ophelia, Oringo, Plumber Joe, Roddy, Rosemary, Shifty, Taylor, Tyzzo and Wool Weaver."
      - "Right-click each of them with an Abiphone to ask for their contact. Most want an item, and Anita, Bartender, Blacksmith, Jax, Jotraeline and Malik have their own requirements, as on Hypixel."
      - "Calling a contact opens their shop or menu from anywhere."
      - "Contacts for NPCs or areas that are not in the game yet, such as Dusk, Fred and Tia the Fairy, still show in the Contacts Directory as not available."
