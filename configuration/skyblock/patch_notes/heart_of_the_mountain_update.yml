title: "The Heart of the Mountain Update"
date: "10th October 2026"
intro:
  - "The Heart of the Mountain is finally a skill tree. Spend Tokens of the Mountain and Powder on permanent mining perks, upgrade the Core of the Mountain and pick a pickaxe ability. Open it with /hotm or from the Mining skill menu."
  - "Perks that need Glacite Mineshafts, the Forge or Crystal Hollows can be bought now but only take effect once those places are added. Those perks say so."
sections:
  - heading: "The Perk Tree"
    colour: "<5>"
    lines:
      - "The tree now looks like Hypixel's: tier rows with a banner for each tier, scroll arrows to reach the higher tiers, and perks coloured coal, emerald or diamond for unbought, bought and maxed."
      - "Unlock a perk with a Token of the Mountain, then upgrade it with Powder. Left-click to upgrade, Shift Left-click to upgrade 10 levels and right-click to disable a perk."
      - "Mining Speed, Mining Fortune, Ore Fortune, Gemstone Fortune, Block Fortune, Mining Wisdom, Powder Buff and more now change your stats."
      - "Titanium Insanium can turn Mithril into Titanium."
      - "Reset your perks any time. Every Powder and Token you spent on them comes back, and your Tier and Core stay."
  - heading: "Core of the Mountain"
    colour: "<d>"
    lines:
      - "Ten Core levels paid for with Mithril, Gemstone and Glacite Powder. Powder spent on the Core is never refunded."
      - "Rewards include extra Tokens, a higher pickaxe ability level, a fourth Commission slot and bonus Powder from mining."
  - heading: "Pickaxe Abilities"
    colour: "<6>"
    lines:
      - "Tier 2 has Mining Speed Boost and Pickobulus, Tier 6 has Tunnel Vision and Maniac Miner, and Tier 10 has Gemstone Infusion and Sheer Force. Some need another perk first."
      - "Unlock them in the tree with a Token of the Mountain, click an unlocked one to select it, then right-click with a pickaxe or drill to use it."
      - "Core of the Mountain level 2 raises your ability level by one."
  - heading: "Powder and Sky Mall"
    colour: "<2>"
    lines:
      - "Mining Mithril now gives Mithril Powder, and your first Mithril each day gives a daily bonus."
      - "Glacite Powder is a new currency."
      - "Sky Mall gives you a random buff every SkyBlock day in the Dwarven Mines."
  - heading: "Other Changes"
    colour: "<a>"
    lines:
      - "Each Heart of the Mountain Tier now gives SkyBlock XP, as does each Core of the Mountain level."
      - "Heart of the Mountain stats show up in your stat breakdown."
