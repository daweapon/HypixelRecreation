title: "The Spider's Den Update"
date: "24th October 2026"
intro:
  - "The Spider's Den is no longer empty. Spiders, skeletons and a Broodmother now live in the Den, its zones have names, and it rains."
sections:
  - heading: "Zones"
    colour: "<c>"
    lines:
      - "The Den is now split into the Spider's Den, Spider Mound, Arachne's Burrow, Arachne's Sanctuary, Gravel Mines, Grandma's House, Michael's Crib and Archaeologist's Camp, each with its own zone name."
  - heading: "Mobs"
    colour: "<a>"
    lines:
      - "Dasher Spiders, Splitter Spiders, Weavers, Voracious Spiders and Spider Jockeys roam the Spider Mound, with stronger versions in Arachne's Burrow. Flint Skeletons guard the Gravel Mines."
      - "Splitter Spiders split into two Silverfish when they die, Weavers shoot webs that slow you down, and Spider Jockeys ride a Jockey Skeleton that throws Silverfish at you."
      - "The Broodmother waits at the top of the Spider Mound and releases cave spiders when she dies. She takes at most 300 damage from each hit, and returns two and a half minutes later."
      - "Every mob counts towards the Spider's Den Bestiary."
      - "Spiders can drop String, Spider Eyes, Arachne's Calling, Top of Nest Travel Scrolls and the Tarantula Pet. The Broodmother drops a Spider Talisman, and Luxurious Spools."
  - heading: "Weather"
    colour: "<b>"
    lines:
      - "Every 40 minutes it rains in the Spider's Den for 20 minutes, and every third rain is a thunderstorm. All lobbies share the same weather."
      - "While it rains you gain +25 Fishing Speed, and Rain Slimes appear at the foot of the mounds by Grandma's House and Michael's Crib. During a thunderstorm 1 in 5 of them is a stronger Toxic Rain Slime."
  - heading: "Mining"
    colour: "<8>"
    lines:
      - "The Spider's Den now gives you Mining Fatigue. You can still break the gravel in the Gravel Mines at normal Minecraft speed, and it grows back about a second and a half later."
  - heading: "NPCs"
    colour: "<6>"
    lines:
      - "Haymitch now talks to you at the Spider's Den spawn. What he says depends on whether you have been up the Spider Mound and on your Combat level."
      - "Grandma Wolf gives you the Grandma Wolf Pet on your first visit, and upgrades it to Uncommon, Rare, Epic and Legendary at Bestiary Milestones 5, 10, 15 and 20. A Bestiary milestone is one family tier."
      - "Bramass Beastslayer gives you the Beastslayer's Codex once you reach Bestiary Milestone 50."
  - heading: "Arachne"
    colour: "<4>"
    lines:
      - "Arachne's Keepers now roam Arachne's Burrow and Arachne's Sanctuary at nine spots, and each comes back a minute after you kill it. They dash at you, leave webs behind them and poison you, and always drop an Arachne's Calling."
      - "Place 4 Arachne's Callings on the altar in Arachne's Sanctuary to wake the Level 87 Arachne (20,000 health), or 1 Arachne Crystal for the Level 143 Arachne (100,000 health, Combat 15 needed). Right-click the altar while holding them."
      - "Each hit on her is capped at 1,000 damage, and arrows and magic do nothing to her. At 50% and 20% health she splits into 10 and then 20 Arachne's Brood, and comes back when you have killed them all. If you have not beaten her within 10 minutes she gets bored and leaves."
      - "Arachne's Venom Shot hits you from afar and drops you to about 1% health every few seconds. Wear a Cow Hat to ignore it."
      - "Everyone who hurts her is rewarded by how much damage they did: Soul String, Spider Essence, String, Spider Eyes and a chance at Arachne's Armor, Arachne's Fang, the Arack, an Arachne Shard and the Tarantula Pet. Your first win against each Arachne gives SkyBlock XP."
      - "Climb to the top of the Spider Mound to earn A Challenging Climb."
  - heading: "Shaggy, the Spider Tamer and Relics"
    colour: "<6>"
    lines:
      - "Once you have beaten Arachne, Shaggy on the top floor of Grandma's House will trade you an Arachne Crystal for 2 Arachne Fragments, 16 Enchanted Spider Eyes and 16 Enchanted String. Put it on the altar for the stronger Arachne."
      - "The Spider Tamer in Arachne's Sanctuary opens the Spider Essence Shop for you after you have beaten Arachne."
      - "Shaggy and the Spider Tamer can both join your Abiphone. Shaggy adds you once you have beaten Arachne, and the Spider Tamer wants a Level 1 Epic Tarantula Pet. Call them to open their shops."
      - "28 Relics are hidden around the Spider's Den, behind cobwebs, spider eggs, mushrooms and gravel. Each pays 10,000 coins, and the Archaeologist at his camp pays another 30,000 for finding them all. He gives you the Archaeologist's Compass, which points to the nearest Relic when you right-click it."
