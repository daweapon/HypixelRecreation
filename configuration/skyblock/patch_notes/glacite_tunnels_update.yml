title: "The Glacite Tunnels Update"
date: "11th October 2026"
intro:
  - "The Dwarven Base Camp and the Glacite Tunnels are open. The Glacite Mineshafts are not part of this update."
sections:
  - heading: "Getting there"
    colour: "<b>"
    lines:
      - "You need Heart of the Mountain Tier 7. Forge a Secret Railroad Pass (1 Flawless Ruby Gemstone, 2 Refined Mithril, 8 Corleonite) and show it to a Ticket Master or Station Master to ride the minecart to the Glacite Tunnels."
      - "Ticket Masters now stand at nine stops of the Dwarven Mines rail network, and the Station Master runs the Dwarven Village stop. The fare is the distance multiplied by 2."
  - heading: "The Cold"
    colour: "<9>"
    lines:
      - "Cold builds up while you are in the Glacite Tunnels: 1 point every 5 seconds, faster if you swim in the Great Glacite Lake. Each point past your Cold Resistance costs 0.5% Mining Speed, and every 25 Cold cuts your Speed cap by 25%, down to a crawl at -75."
      - "Cold Resistance slows it down. At -100 Cold you freeze to death and wake up in the Dwarven Base Camp, which also resets your Cold."
  - heading: "New ores"
    colour: "<6>"
    lines:
      - "Mine Umber, Tungsten and Glacite for Glacite Powder, and Aquamarine (blue), Citrine (brown), Onyx (black) and Peridot (green) gemstones. All need Breaking Power 9. They grow back 15 seconds after Mithril would."
      - "Your first Glacite mined each day pays 500 Glacite Powder per Heart of the Mountain tier."
  - heading: "Dwarven Base Camp"
    colour: "<a>"
    lines:
      - "Emissary Lissandra hands out Glacite Tunnels commissions at Heart of the Mountain Tier 7: collect 1,500 of Umber, Tungsten, Glacite, Aquamarine, Citrine, Onyx or Peridot for Glacite Powder, Heart of the Mountain XP and Mining XP."
      - "Dulin, Cold Enjoyer, Scout Plinius, Scout Scardius, Sor'Hen and the Fossil Muncher now live in and around the Base Camp."
  - heading: "Changes"
    colour: "<c>"
    lines:
      - "Glacite Walkers are now Level 24 with 888 health, like on Hypixel."
      - "The Dwarven Mines Bestiary now works, with the Goblin, Diamond Goblin, Golden Goblin, Glacite Walker and Treasure Hoarder families."
      - "There are about a third fewer Goblins in the Goblin Burrows."
