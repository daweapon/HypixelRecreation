title: "The Kuudra Update"
date: "9th October 2026"
intro:
  - "Kuudra has risen! The Lava Kraken can now be fought in Kuudra's Hollow beneath the Crimson Isle, in all five tiers, solo or with up to three friends."
  - "Rescue Elle's supplies, build the Ballista, fuel it and shoot Kuudra down. From Burning Tier up you'll have to stun him from the inside first, and on Infernal his real lair awaits."
sections:
  - heading: "Getting In"
    colour: "<c>"
    lines:
      - "Finish the Crimson Isle Faction questline and Elle takes you to Kuudra for your first fight."
      - "After that, talk to Crag at the Forgotten Skull or in the Dungeon Hub and pick a tier. Clicking a tier queues your party straight away."
      - "Tiers: Basic, Hot (1,000 Reputation), Burning (3,000), Fiery (7,000) and Infernal (12,000). Each tier also needs the one before it beaten."
      - "Parties of 1 to 4 players. Only the party leader can queue; everyone else sees Need party leader!"
      - "Talk to Elle in the Hollow to ready up. Once everyone is ready the fight starts after a 4 second countdown."
      - "Turn on Toggle Auto Ready Up in Crag's menu to ready up as soon as you arrive."
  - heading: "Kuudra Party Finder"
    colour: "<d>"
    lines:
      - "Find a Party in Crag's menu opens the Kuudra Party Finder."
      - "Browse open groups with their tier, note, required Combat level and members, and click one to join it. You join the leader's party."
      - "Start a New Queue lists your own party: pick the tier, write a note and set the Combat level players need."
      - "Search Settings filter by tier, search text and Combat level range, and sort by newest, highest level required or largest group. Right-click to reset."
      - "Groups are shared across every server and are taken down when the leader queues or de-lists them."
  - heading: "The Fight"
    colour: "<6>"
    lines:
      - "Supplies: Elle's supplies fell into the lava. Pull the crates in with a lava rod, stand still to pick one up, and carry it to an empty pile."
      - "Build: sneak and punch the six piles to build the Ballista while Kuudra's minions try to wreck it."
      - "Fuel: fish up the Ballista Fuel Cells, load them, then mount the Ballista and fire at Kuudra. Every shot needs a fresh load of fuel."
      - "Kuudra keeps rising out of the lava and sinking back in, and his tentacles slam the platform. Watch for the coloured floor."
      - "Waves of minions arrive on a timer: Blights, Berserkers, Landmines, Knockers, Slashers, Wither Sentries, Dropships, Wandering Blazes, Magma Followers and more."
      - "Man the platform's cannons to shoot minions down."
      - "Die and you become a ghost until you respawn. You can still use the Perk Shop as a ghost."
  - heading: "Stunning Kuudra"
    colour: "<5>"
    lines:
      - "From Burning Tier up, Kuudra can't be hurt until he is stunned."
      - "Once the Ballista is built he eats Elle. Get into his stomach through the Consumption Zone or a Human Cannonball."
      - "Mine one of the three purple pods inside to stun him, then shoot him with the Ballista or hit him while he is down."
      - "When he sinks, the stomach floods and you're flushed back out, so get in quick."
  - heading: "Infernal Tier"
    colour: "<4>"
    lines:
      - "At 25% health on Infernal, the centre of the platform collapses into Kuudra's real lair."
      - "Elle won't follow you down. Hit Kuudra's head as it pokes out of the lava walls."
      - "Dodge the green floor telegraphs before they turn red. Every death in the lair is final unless a Support revives you."
  - heading: "Tokens and Perks"
    colour: "<e>"
    lines:
      - "Earn Kuudra Tokens by recovering supplies, loading fuel and killing minions, and spend them at the Perk Shop on the platform."
      - "Pick one route each run: Cannoneer, Crowd Control, Specialist or Support, each with its own upgrades."
      - "Anyone can buy Auto Revive, Human Cannonball, Elle's Lava Rod and Elle's Pickaxe. The Remote Perk Shop opens the shop from anywhere."
      - "Vulcan's Crimson Essence perks now apply in the fight: Strongarm, Fresh Tools, Headstart and Kuudra Master."
      - "Kuudra's Kidney, Lung and Heart speed up supplies and the Ballista build."
  - heading: "Rewards"
    colour: "<a>"
    lines:
      - "KUUDRA DOWN! Every win opens the Free Chest and the Paid Chest. You can open one of them, and the Paid Chest takes that tier's Kuudra Key."
      - "Chests you don't open wait at Vesuvius in the Forgotten Skull for 72 hours, up to 60 runs, with an Opened and Unopened filter."
      - "Each tier's first clear gives SkyBlock XP, and the Kuudra Boss Collection levels up as you clear more."
      - "Wins pay daily Reputation once per tier and count for Kuudra Faction Quests."
      - "Each Kuudra win can drop a Tentacle Dye."
      - "Leader of the run? Click the line at the end of the run, or use /instancerequeue, to go again on the same tier."
      - "The Kuudra Bestiary has 13 families to level up."
  - heading: "Bows and Rods"
    colour: "<b>"
    lines:
      - "The Terminator is here: three arrows at once, a shortbow with no draw time, and Salvation, a beam that pierces up to five enemies."
      - "Terror Armor's Hydra Strike works: arrow hits build stacks that add damage and arrow speed, and at 10 stacks you fire two extra arrows."
      - "The Juju, Artisanal, Mosquito, Scorpion, Dragon, Machine Gun and Spirit shortbows now really are shortbows."
      - "Arrows can now hit giant targets like Kuudra."
      - "Lava rods, including the Magma Rod, now cast as far as a normal fishing rod, so they reach Kuudra's lava."
      - "Fishing rod tooltips now look like Hypixel's, with the Hook, Line and Sinker slots and Gemstone slots."
  - heading: "Fixes"
    colour: "<7>"
    lines:
      - "The Sack of Sacks now shows the sacks inside it instead of losing them."
      - "Quivers now save properly."
      - "The tab list shows rounded stats again."
      - "Staff: /maxprofile now fills the Sack of Sacks and every quiver slot, and maxes every Kuudra tier, wave record, the Kuudra Bestiary and the Kuudra collection. Kuudra Keys stay unbought."
