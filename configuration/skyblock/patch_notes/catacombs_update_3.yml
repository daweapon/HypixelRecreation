title: "The Catacombs Update, Part 3"
date: "5th November 2026"
intro:
  - "The Catacombs now use real Hypixel dungeon rooms. The Catacombs are still a staff preview."
sections:
  - heading: "Real rooms"
    colour: "<a>"
    lines:
      - "16 real rooms are in: Start, Blood, Fairy, the Yellow miniboss room, Trap, Quiz, Ice Fill, Hallway, Market, Gravel, Museum, Deathmite, Dino Site, Wizard, Well and Red Blue."
      - "Every run's Start, Blood, Fairy and miniboss rooms are real, and most larger rooms are too."
      - "Secrets sit where they are in Hypixel's rooms: chests, the Museum Mimic chest, items, bats and Wither Essence."
      - "Doors only open where a room really has a doorway."
      - "15 more real rooms from Hypixel Floor 1 runs: Overgrown, Silvers Sword, Double Diamond, Redstone Warrior, Grass Ruin, Diagonal, Catwalk, Rails, Chambers, the Water Board, Teleport Maze and Creeper Beams puzzle rooms, the Dragon and Default miniboss rooms, and Hypixel's own Start room."
      - "Mobs in these rooms (and the Hallway) stand where they stood on Hypixel, with the same types, and real crypts are used where the room has them."
      - "43 more real rooms from four Hypixel Master Mode Floor 7 runs, among them Atlas, Buttons, Crypt, Draw Bridge, Lava Ravine, Layers, Melon, Quartz Knight, Sewer, Stairs, Withermancers, Admin, Tomioka and Zodd, a second Trap room, a second Default miniboss room and a second Blood room. The Three Weirdos, Boulder, Tic Tac Toe and Blaze puzzle rooms are now real rooms too."
      - "Start, Blood, Fairy, Hallway, Gravel, Museum, Deathmite, Dino Site, Red Blue, Ice Fill, Trap and the Shadow Assassin room now use the blocks captured on Hypixel, with real skulls and details."
      - "Mobs in the Master Mode rooms stand where they stood on Hypixel; each higher-floor mob becomes its Floor 1 counterpart (a Zombie Knight is a Zombie Grunt) and keeps its star."
  - heading: "Looks like Hypixel"
    colour: "<b>"
    lines:
      - "The Entrance room's exit is gated while the party waits; the gate sinks into the floor when the run starts. Wither and Blood doors open the same way, with Hypixel's sounds."
      - "Mort waits in the Entrance room, says his three lines at the start and hands out the map. Click him before the run to ready up."
      - "Dungeon mobs wear their Hypixel skins and gear, with Hypixel's name tags: mob-type icons, the gold star, minibosses in bold."
      - "The Blood room plays out like Hypixel: the Watcher floats in, summons 9 named undead on Floor 1 in two waves, counts them on his boss bar, then opens a portal in the far doorway and leaves a Blessing of Life and of Power. The Blood room is always entered from the back."
      - "Four fairies float around the Fairy room tree. Killing one revives a dead teammate and drops a Revive Stone."
      - "Bonzo wears his real skins, a new one for his second life."
  - heading: "Bonzo's real fight"
    colour: "<6>"
    lines:
      - "Floor 1's portal now leads into Hypixel's own Bonzo arena, the circus tent, copied block for block."
      - "Bonzo talks, dashes off, throws summoning orbs that land as Undead, fires Wither Skulls, says \"Oh I'm dead!\" and \"Sike\", then comes back for a second life with Bonzo's Staff, balloons and a Balloon Barrage."
      - "When he falls, the score screen, EXTRA STATS and the re-queue link appear as on Hypixel, and the two exit gates sink into the floor."
      - "The reward chests are Hypixel's real chest models on sea lanterns around Bonzo's spawn. Their menus match Hypixel's, and Floor 1 chests cost 20,000, 40,000 and 80,000 coins as on Hypixel."
      - "The exit portal at the end of the corridor takes you back to the Dungeon Hub."
  - heading: "Not here yet"
    colour: "<c>"
    lines:
      - "Rare rooms and the Ice Path puzzle are still placeholders, and the real puzzle rooms cannot be solved yet. Levers, Superboom walls and Tomioka's shop are not working yet."
      - "Mobs in the Market, Well, Wizard and Quiz rooms and some crypt spots are still placed by estimate."
