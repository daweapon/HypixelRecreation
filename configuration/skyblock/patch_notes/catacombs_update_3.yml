title: "The Catacombs Update, Part 3"
date: "5th November 2026"
intro:
  - "The Catacombs now use real Hypixel dungeon rooms. The Catacombs are still a staff preview."
sections:
  - heading: "Real rooms"
    colour: "<a>"
    lines:
      - "16 real rooms are in: Start, Blood, Fairy, the Yellow miniboss room, Trap, Quiz, Ice Fill, Hallway, Market, Gravel, Museum, Deathmite, Dino Site, Wizard, Well and Red Blue."
      - "Every run's Start, Blood, Fairy and miniboss rooms are real, and most larger rooms are too."
      - "Secrets sit where they are in Hypixel's rooms: chests, the Museum Mimic chest, items, bats and Wither Essence."
      - "Doors only open where a room really has a doorway."
      - "15 more real rooms from Hypixel Floor 1 runs: Overgrown, Silvers Sword, Double Diamond, Redstone Warrior, Grass Ruin, Diagonal, Catwalk, Rails, Chambers, the Water Board, Teleport Maze and Creeper Beams puzzle rooms, the Dragon and Default miniboss rooms, and Hypixel's own Start room."
      - "Mobs in these rooms (and the Hallway) stand where they stood on Hypixel, with the same types, and real crypts are used where the room has them."
      - "43 more real rooms from four Hypixel Master Mode Floor 7 runs, among them Atlas, Buttons, Crypt, Draw Bridge, Lava Ravine, Layers, Melon, Quartz Knight, Sewer, Stairs, Withermancers, Admin, Tomioka and Zodd, a second Trap room, a second Default miniboss room and a second Blood room. The Three Weirdos, Boulder, Tic Tac Toe and Blaze puzzle rooms are now real rooms too."
      - "Start, Blood, Fairy, Hallway, Gravel, Museum, Deathmite, Dino Site, Red Blue, Ice Fill, Trap and the Shadow Assassin room now use the blocks captured on Hypixel, with real skulls and details."
      - "Mobs in the Master Mode rooms stand where they stood on Hypixel; each higher-floor mob becomes its Floor 1 counterpart (a Zombie Knight is a Zombie Grunt) and keeps its star."
      - "No more blank grey rooms: every room in a run is a real Hypixel room. The map picks rooms whose doorways fit instead of giving up and filling the run with placeholders, and if every fitting room is already used, a real room repeats."
  - heading: "Looks like Hypixel"
    colour: "<b>"
    lines:
      - "The Entrance room's exit is gated while the party waits; the gate sinks into the floor when the run starts. Wither and Blood doors open the same way, with Hypixel's sounds."
      - "Mort waits in the Entrance room (he was missing from runs before), says his three lines at the start and hands out the map."
      - "Click Mort before the run for Hypixel's Ready Up menu: ready up, pick your class (with a count of who picked each), claim a Dungeon Orb and toggle Auto Ready Up, which readies you a few seconds after you arrive. The Ready dye and the class Nether Star are gone from the hotbar."
      - "Wither and Blood Keys drop where the last starred mob of their room died, or from the miniboss in a miniboss room."
      - "Right-click the Magical Map to open the SkyBlock Menu. Profile Management is disabled in Dungeons, as on Hypixel."
      - "Dungeon mobs wear their Hypixel skins and gear, with Hypixel's name tags: mob-type icons, the gold star, minibosses in bold."
      - "The Blood room plays out like Hypixel: the Watcher floats in, summons 9 named undead on Floor 1 in two waves, counts them on his boss bar, then opens a portal in the far doorway and leaves a Blessing of Life and of Power. The Blood room is always entered from the back."
      - "Four fairies float around the Fairy room tree. Killing one revives a dead teammate and drops a Revive Stone."
      - "Bonzo wears his real skins, a new one for his second life."
      - "Secret levers work: pulling one clears the iron bars, log wall or floor it guards the way Hypixel's gates sink away, and a second pull says the lever has already been used."
      - "More levers open their doors, worked out from secret guide videos: Atlas, Museum, Chambers, Hallway, Buttons and both Grass Ruin levers. A pull now says you hear the sound of something opening."
      - "Superboom TNT and InfiniBoom™ TNT blow open the cracked stone brick walls in real rooms with either click, as well as crypts."
      - "Doorways now use Hypixel's own door frames, and a wall where the map puts no door is a plain wall instead of a filled-in frame."
  - heading: "Bonzo's real fight"
    colour: "<6>"
    lines:
      - "Floor 1's portal now leads into Hypixel's own Bonzo arena, the circus tent, copied block for block."
      - "Bonzo talks, dashes off, throws summoning orbs that land as Undead, fires Wither Skulls, says \"Oh I'm dead!\" and \"Sike\", then comes back for a second life with Bonzo's Staff, balloons and a Balloon Barrage."
      - "When his first life runs out Bonzo drops his staff, topples over and lies flat on the floor, unhittable, until \"Sike\" gets him back on his feet."
      - "When he falls, the score screen, EXTRA STATS and the re-queue link appear as on Hypixel, and the two exit gates sink into the floor."
      - "The reward chests are Hypixel's real chest models on sea lanterns around Bonzo's spawn. Their menus match Hypixel's, and Floor 1 chests cost 20,000, 40,000 and 80,000 coins as on Hypixel."
      - "The exit portal at the end of the corridor takes you back to the Dungeon Hub."
  - heading: "Dungeonbreaker and Wither Armor"
    colour: "<c>"
    lines:
      - "The Dungeonbreaker is here. Ophelia sells it for 500 Wither Essence once you have completed Floor III. Hold it in a run and blocks break instantly; each one costs one of its 20 charges, two charges come back every second, and its lore shows how many are left."
      - "Broken blocks come back after 10 seconds. Breaking a 21st block brings your oldest one back straight away, and everything still broken comes back when the run ends."
      - "It only works in rooms your party has explored. Puzzle rooms, room edges, doors, crypts, secrets, levers and what they open, weak walls, chests and skulls cannot be broken, and boss rooms are off limits (only the Floor VII Wither Lords fight will allow it)."
      - "Staff are not limited by charges or by the 20-block cap (this differs from Hypixel on purpose); their blocks still come back after 10 seconds and the same blocks stay unbreakable."
      - "Echoes of the Lost can now be bought in Malik's Wither Essence shop: every secret you find restores 1 to 5 charges on your Dungeonbreaker."
      - "All five Wither Armor sets now work: Wither, Maxor's, Storm's, Goldor's and Necron's. Each piece takes 10% off damage from withers, and each Maxor's piece adds 5% arrow damage."
      - "Any four Wither Armor pieces, mixed or matched, give Witherborn: every 30 seconds a small wither minion appears (one at a time), flies at the nearest enemy and explodes for your normal hit damage on everything around it. The set bonus counter in the lore now counts the pieces you are wearing."
      - "Infinityboom TNT is now called InfiniBoom™ TNT, as on Hypixel."
  - heading: "Fixes"
    colour: "<e>"
    lines:
      - "Entering a Catacombs run no longer shows a SkyBlock Level Up every time. Dungeon accessories count double inside Dungeons, and that was leaking into the Accessory Bag SkyBlock XP task."
      - "Joining a server never announces a SkyBlock Level Up; it only brings your level up to date."
  - heading: "Not here yet"
    colour: "<c>"
    lines:
      - "Rare rooms and the Ice Path puzzle are not built yet, so runs use other real rooms in their place, and the real puzzle rooms cannot be solved yet. Tomioka's shop is not working yet, and a few levers (Deathmite, Rails, Trap Hard) still open nothing because what they open has not been worked out."
      - "Mobs in the Market, Well, Wizard and Quiz rooms and some crypt spots are still placed by estimate."
      - "Witherborn cannot be switched off with the Pick Block key yet, and Wither Armor still has no normal way to get it until Floor VII is playable."
