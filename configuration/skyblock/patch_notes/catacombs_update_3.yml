title: "The Catacombs Update, Part 3"
date: "5th November 2026"
intro:
  - "The Catacombs now use real Hypixel dungeon rooms. The Catacombs are still a staff preview."
sections:
  - heading: "Real rooms"
    colour: "<a>"
    lines:
      - "16 real rooms are in: Start, Blood, Fairy, the Yellow miniboss room, Trap, Quiz, Ice Fill, Hallway, Market, Gravel, Museum, Deathmite, Dino Site, Wizard, Well and Red Blue."
      - "Every run's Start, Blood, Fairy and miniboss rooms are real, and most larger rooms are too."
      - "Secrets sit where they are in Hypixel's rooms: chests, the Museum Mimic chest, items, bats and Wither Essence."
      - "Doors only open where a room really has a doorway."
      - "15 more real rooms from Hypixel Floor 1 runs: Overgrown, Silvers Sword, Double Diamond, Redstone Warrior, Grass Ruin, Diagonal, Catwalk, Rails, Chambers, the Water Board, Teleport Maze and Creeper Beams puzzle rooms, the Dragon and Default miniboss rooms, and Hypixel's own Start room."
      - "Mobs in these rooms (and the Hallway) stand where they stood on Hypixel, with the same types, and real crypts are used where the room has them."
  - heading: "Not here yet"
    colour: "<c>"
    lines:
      - "Rare rooms and five puzzle rooms are still placeholders, and the real puzzle rooms cannot be solved yet."
      - "Mobs in the M7-sourced rooms and some crypt spots are still placed by estimate."
