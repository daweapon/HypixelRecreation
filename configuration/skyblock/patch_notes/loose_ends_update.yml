title: "The Loose Ends Update"
date: "4th November 2026"
intro:
  - "A sweep across SkyBlock that finishes a long list of half-built features: The End gets its Protector, Ender Nodes and End Race, the Raffle of the Century arrives, the Abiphone gains the 9f Network, and dozens of smaller pieces finally work."
sections:
  - heading: "The End"
    colour: "<d>"
    lines:
      - "End Stone and Obsidian can be mined in The End and the Dragon's Nest; mined blocks regrow after 5 seconds. Obsidian could not be mined anywhere before, including Obsidian Sanctuary."
      - "Ender Nodes: 18 glowing End Stone and 18 Obsidian nodes drop Enchanted End Stone and Obsidian, Enchanted Ender Pearls, Experience Bottles, the Ender Gauntlet, End Stone Shulker, End Stone Geode, Magical Rune or Shrimp the Fish."
      - "Nest Endermites crawl out of Ender Nodes and drop Mite Gel. A Stonk keeps them away, and the Endermite Pet's Mite Bait adds extra mites. Mining End Stone without a Stonk can disturb an Endermite."
      - "The End Stone Protector awakens after 5,000 Zealot kills on your server: a 5 million health golem with Toss and Crush, dropping End Stone Roses, Crystal Fragments, its shard, Tier Boost Cores and the Golem Pet."
      - "The Dragon's Gate seals during dragon fights. Break its 1,000,000 HP door to get back into the Nest, and watch for the Endermites and Endermen that climb out. The dragon also calls hostile Zealots."
      - "Dragon fights have music, and the DOWN! summary now shows and awards Runecrafting Experience."
      - "Guber's End Race is open: race to the far side of The End and back for Silent Pearls, the Enderman Mask, Nope the Fish and the Pig's Foot. Finish blind during the Great Spook for an Obscure Ending."
      - "Seers drop the Lone Adventurer's Dragon Shortbow while his quest asks for it."
      - "New Dragon Essence perks: Infused Dragon and Two-Headed Strike."
  - heading: "Slayers"
    colour: "<c>"
    lines:
      - "Slayer bosses now have a 3:00 despawn timer (4:00 for Sven). If it runs out, the quest fails."
      - "Voidgloom Seraph has its full drop table on every tier, and new minibosses: Voidling Devotee, Voidling Radical and Voidcrazed Maniac."
      - "Tarantula Broodfather: Bat Barrage summons Primordial Bats in waves, and unbroken egg sacs hatch into Primordial Hatchlings or Primordial Minions."
      - "New Spider Slayer minibosses: Tarantula Vermin, Tarantula Beast, Mutant Tarantula, Primordial Jockey and Primordial Viscount."
      - "Rogue Flesh: kill a Tier I Revenant Horror at 00:01 during the Great Spook."
  - heading: "Raffle of the Century"
    colour: "<6>"
    lines:
      - "Every hundredth SkyBlock year, talk to Rezzus in the Village to join one of five teams and earn Raffle Tickets: 1 every 15 minutes, 21 Raffle Tasks every 2 hours, and Cake Slices fed to players on your matching team."
      - "Speed Raffles every 2 hours, Daily Raffles every day and The Big One at the end. Open the Incredible Raffle Box or use /century to see your entries and claim prizes. Milestones I to VII give coins, emblems and more."
      - "Simon hands every player a Century Cake during the event. Century Cakes can be placed on your island and eaten for 48 hour stat boosts, with a tiny chance of a Cake Soul. The Cake Counter shows your island's cakes and souls."
  - heading: "Abiphone"
    colour: "<a>"
    lines:
      - "The 9f Network is live. Add Tia the Fairy while wearing Fairy Armor and repair 9 relays across SkyBlock in a sound-matching minigame, for up to +18 Health and +8 contact slots. Fred's signal clears once all 9 are done."
      - "14 new contacts: George, Zog, Vincent, Dusk, Sirius, Mort, Terry, St. Jerry, Marigold, Queen Mismyla, Professor Wynd, Feast Baker Scott, Fred and Tia the Fairy. Marigold, Queen Mismyla, Fred, Professor Wynd and Feast Baker Scott are new NPCs."
      - "Terry trades Salt Cube, Rusty Anchor, Terry's Snowglobe and Frozen Bauble for Ice Hunks. Sirius calls before each Dark Auction and refunds 1% of winning bids. St. Jerry hands out a White Gift once per year."
      - "Contacts show their real heads, and they no longer call again after you relog."
  - heading: "Hoppity and the Chocolate Factory"
    colour: "<6>"
    lines:
      - "Torrhus Canyon has 15 Chocolate Eggs during Hoppity's Hunt."
      - "Rabbit Factions at Chocolate Factory V: join the City, Mountain, Country or Beach Rabbits in the Faction Tower and find Faction Rabbits in your eggs."
      - "Chocobits at Chocolate Factory VI: find one of 33,333 unique Chocobits (+0.2x each), and pay 1M coins a year in the Chocobit Tower to keep them."
      - "Chocolate Fortune is in the Chocolate Shop. The Dark Cacao Truffle ages into Cocoa Beans Fortune and evolves into the Refined Dark Cacao Truffle. Zorro's Cape has its 20% extra contest medal chance."
  - heading: "Garden and Farming"
    colour: "<a>"
    lines:
      - "Garden Skins: unlock Barn and Greenhouse skins and pick one at the Desk. They don't change the Garden's look yet."
      - "Taylor visits the Garden with one offer at a time and gives the skin. The Archaeologist visits once you have found all 28 Relics; Tyashoi Alchemist and Vargul visit during the Great Spook, and Bednom can visit too."
      - "The Underground Lab's bookshelf door opens when you pull the stuck lever. Talbot sells the Douce Pluie de Stinky Cheese Potion (+20 Bonus Pest Chance) for 40 Pelts."
      - "The Crop Analyzer accepts a Mutation clicked from your inventory, Trapper Crests track their own Pelts, and reaching Farming V for the Farmhand gives its +5 SkyBlock XP."
  - heading: "Fishing"
    colour: "<b>"
    lines:
      - "Six Spooky sea creatures can be caught in any water during the Spooky Festival."
      - "Backwater Bayou has its own sea creatures: Trash Gobbler, Dumpster Diver, Banshee, Bayou Sludge, Alligator and Titanoboa."
      - "Water Hotspots can hook Frog Man, Snapping Turtle, Manta Ray, Blue Ringed Octopus and Wiki Tiki. The Deep Sea Protector appears in ordinary water."
      - "Talk to Guard Gornum in the Abandoned Quarry to fish up Mithril Grubbers, which drop Mithril Powder."
      - "Shark Scale Armor's Festival Fisher bonus works: +10% to +20% Shark chance with 2 or more pieces."
  - heading: "Mixins"
    colour: "<5>"
    lines:
      - "Mixins can be consumed while a Booster Cookie and a God Potion are active. Glowing Mush (Moby), Hot Chocolate (Chocolate Shop), Zombie Brain, Spider Egg, Gabagoey and Deepterror work now; the Deepterror Mixin can be crafted from Mite Gel and Ritual Residue."
  - heading: "Mines and Caverns"
    colour: "<e>"
    lines:
      - "Deep Caverns mobs use the current coins, Combat XP and Bestiary tiers. Sneaky Creepers drop Enchanted Gunpowder, Redstone Pigmen drop the Flaming Sword, and Miner Skeletons drop 3 Bones and can drop Bone Dye."
      - "Redstone Pigmen are neutral until you hit one or carry a stack of Redstone; then the whole pack turns on you."
      - "New NPC Bednom in the Dwarven Village: his nightmare quest, buried treasure, the Nightmare achievement and the Nightmare Nullifier."
      - "New NPC Dirt Guy in the Dwarven Mines. Anita sells the InfiniDirt Wand, and Dirt Guy swaps it for a Precious during the Great Spook."
      - "Cult of the Fallen Star: only Dalir confirms your meeting attendance, and Dalir, Thondin and Brarnas have their real looks."
  - heading: "Spider's Den"
    colour: "<c>"
    lines:
      - "Dasher Spiders and Arachne's Brood leap at players. Flint Skeletons come back if you leave their Bone on the ground for 5 seconds."
      - "Arachne can be Runic, and everyone who damages her gets Bestiary progress."
      - "Relics have their real look, and the Archaeologist's Compass needle points at the nearest Relic."
  - heading: "Mayors and events"
    colour: "<9>"
    lines:
      - "Profile playtime is now tracked. The Tyashoi Alchemist needs 10 hours of it, and Dante's Goons let players under 8 hours through."
      - "The Blood God Sigil counts kills: +2 Strength for every digit. During the Uprising, look up with full mana to send an Energy Ball to Technoblade. The Ancient Pig's Thunder brings Charged Creepers and Skeleton Horses."
      - "Foxy's Extra Event can be a Spooky Festival, a Mining Fiesta or a Fishing Festival. Special candidates follow the real year rotation (Scorpius, Derpy, Jerry). While Dante is mayor, the Hub turns to desert."
      - "More Spooky Festivals happen during the Great Spook. The Tyashoi Alchemist has his pumpkin head, and each trade tells you which number player you were to obtain it. Vargul's Drain V respects your Shop Confirmations setting."
  - heading: "Elsewhere"
    colour: "<7>"
    lines:
      - "The Dojo has a Top 10 leaderboard for each test next to Master Tao (also under /lb), and Rusty resells Dojo belts at the right prices."
      - "Carnival leaderboards rank your best score in each game. Claim Top 500 and 1,000 point trophies with /carnivalrewards after the Carnival closes."
      - "Fire Sales include every skin variant sold that day. Animated pet skins can be applied, and animated helmet skins animate for other players."
      - "Advent Calendar day 25 gives the North Star Rock Skin (MVP+). The portal delete menu can hide the remove hologram, and the Weather Wand's weather is saved on your island."
      - "The Hilt of Revelations can be sold and bought back. Tony, Talbot and Hunter Ava have their real looks and spots."
