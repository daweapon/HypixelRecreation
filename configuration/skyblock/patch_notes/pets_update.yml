title: "The Pets Update"
date: "8th October 2026"
intro:
  - "Every pet from SkyBlock is here! 71 new pets, every Pet Item, Pet Candy, Pet Skins and a Kat who finally does her job."
  - "Pets whose homes aren't built yet are already in the game. Their abilities that need those places say Not active yet."
sections:
  - heading: "New Combat Pets"
    colour: "<4>"
    lines:
      - "Added 26 Combat pets: Ankylosaurus, Crow, Eerie, Ender Dragon, Enderman, Ghoul, Golden Dragon, Golem, Hound, Horse, Jerry, Kuudra, Mammoth, Phoenix, Pigman, Precursor Drone, Rat, Rift Ferret, Skeleton, Spider, Spirit, T-Rex, Tarantula, Turtle, Wolf and Zombie."
      - "The Golden Dragon hatches at level 100 and can be levelled to 200."
      - "Craft the Horse, Zombie, Skeleton, Spider, Wolf, Pigman and Crow once you reach tier III of their collection. The Jerry pet can always be crafted."
      - "Hounds drop from wolves in the Ruins, Rats from the rats in the Hub sewers, and the Phoenix, very rarely, from any monster."
      - "The Turtle pet can now appear at the Dark Auction."
  - heading: "New Gathering Pets"
    colour: "<3>"
    lines:
      - "Fishing: Ammonite, Dolphin, Flying Fish, Hermit Crab, Megalodon, Penguin, Seal, Spinosaurus and Squid."
      - "Mining: Armadillo, Bal, Bat, Endermite, Glacite Golem, Goblin, Mithril Golem, Mole, Rock, Scatha, Silverfish and Wither Skeleton."
      - "Foraging: Frog, Jade Dragon, Ocelot and Sloth. The Jade Dragon can be levelled to 200."
      - "Megalodons drop from Tiger Sharks and Great White Sharks during the Fishing Festival, and the Megalodon's Feeding Frenzy raises your Shark chance."
      - "Flying Fish drop from The Sea Emperor, and Squid pets can be fished up in water."
      - "Junker Joel sells the Hermit Crab pet for 32 Rusty Coins."
      - "Craft the Bat, Endermite, Mithril Golem, Silverfish, Wither Skeleton and Ocelot from their collections."
  - heading: "Every Other Pet"
    colour: "<2>"
    lines:
      - "Added the final pets: Bingo, Eagle, Guardian, Hedgehog, Jellyfish, Montezuma, Mosquito, Orchid Mantis, Owl, Parrot, Pig, Rabbit, Rose Dragon, Sheep, Slug, Witch, and the Droplet, Frost, Glacial and Subzero Wisps."
      - "The Rose Dragon can be levelled to 200."
      - "Craft the Rabbit and Sheep at Raw Rabbit III and Mutton III. The Mosquito unlocks at Tarantula Slayer 7 and the Droplet Wisp at Inferno Demonlord 1."
      - "Jellyfish and Parrot pets can now appear at the Dark Auction, and Fann sells the Owl for 2,200,000 coins."
      - "New perks work, including Mana Pool, Mana Saver, Repeat, Flamboyant, Drophammer, Icehammer, Swift Sickles, Efficient Farming and Garden Power."
      - "Pets whose source isn't in the game yet say so at the bottom of their tooltip."
  - heading: "Pets For Everyone"
    colour: "<6>"
    lines:
      - "Every pet now has its current stats, ability values and textures at every rarity."
      - "Many abilities that said Not active yet now work, including the Elephant, Giraffe, Blue Whale, Black Cat, Mooshroom Cow, Snail, Magma Cube and Baby Yeti."
      - "Grandma Wolf's Kill Combo works while she sits in your Pets menu, even when not summoned."
      - "Griffin's King of Kings now scales with level."
      - "Pets now train your Taming skill as they earn Pet Exp."
      - "The Pets menu sorts by rarity, then level."
  - heading: "Pet Items"
    colour: "<9>"
    lines:
      - "Added every Pet Item with its real effect: Exp Boosts for every skill, Big Teeth, Iron Claws, Sharpened Claws, Hardened Scales, Lucky Clover, Quick Claw, Textbook, Reaper Gem, Tier Boost, Exp Share, Barrel of Riches, Lotus Crown and many more."
      - "Tier Boost raises your pet's rarity by one tier while held, up to Legendary."
      - "Exp Share gives a pet in an Exp Share slot +15% share rate."
      - "Giving your pet a new item returns its old one for a fee based on the old item's rarity."
      - "The Super Scrubber from Plumber Joe removes your pet's item for the same fee."
  - heading: "Pet Candy"
    colour: "<d>"
    lines:
      - "Added Simple, Great, Superb and Ultimate Carrot Candy and Pet Cake. Right-click your summoned pet to feed it Pet Exp."
      - "A pet can eat 10 Carrot Candy in its lifetime. Pet Cake has no limit."
  - heading: "Kat"
    colour: "<5>"
    lines:
      - "Kat now actually upgrades your pet's rarity."
      - "Kat charges the real upgrade items, gives a coin discount based on your pet's level and checks your Taming level."
      - "Added Kat's upgrade items for Bee, Frog, Pig, Seal, Sloth and Witch pets, and every Mythic upgrade item."
      - "Bee pets upgrade with Honey Dippers, and Seal, Frog and Sloth pets with their own treats."
      - "Mythic upgrades for the Elephant, Black Cat, Baby Yeti, Enderman, Rat, Spider, Tarantula, Armadillo, Bat, Endermite and Mithril Golem."
      - "Kat no longer duplicates or loses pets, and won't take a pet holding a Tier Boost."
  - heading: "Pet Skins"
    colour: "<b>"
    lines:
      - "Added all 365 Pet Skins with their real textures."
      - "Hold a skin and right-click your summoned pet to apply it. It changes your pet's look in the Pets menu, as an item and while summoned."
      - "Unlike on Hypixel, skins aren't lost: Shift-Right-click a pet in the Pets menu to take its skin off, and a new skin gives the old one back."
      - "Animated skins, and skins for pets that aren't in SkyBlock yet, can't be applied yet. Skins have no way to obtain them yet."
  - heading: "Shops and Drops"
    colour: "<e>"
    lines:
      - "Zog's shop matches Hypixel."
      - "Bea sells a Common Bee pet for 50 coins and all four Honey Dippers."
      - "Rusty sells the Reaper Gem once you reach Zombie Slayer 9."
      - "Deep Caverns mobs drop the Exp Share Core, Diamond Goblins the Pure Mithril Gem and the Carrot King the Lucky Clover Core."
  - heading: "Museum"
    colour: "<6>"
    lines:
      - "The Snow Necklace, Snow Cloak, Snow Belt and Snow Gloves Special Items can now be donated, and no longer take a piece from your Snow Suit."
      - "Items shared between several Museum entries now go to the entry they complete."
  - heading: "Fixes"
    colour: "<c>"
    lines:
      - "Opening Pets from the Loadouts menu works again."
      - "Paying with items from your sacks no longer takes the whole stack when your inventory has none."
