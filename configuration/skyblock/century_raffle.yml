# Raffle of the Century (wiki Raffle of the Century, Year 500 rules). Runs for the whole of every SkyBlock year
# divisible by 100, or while staff force it with /force century.
# Verified: 1 ticket per 15 minutes online, 3 tickets for joining a team, 21 tasks (7/7/7) every 2 hours, 1 ticket +
# 1 cake slice per task, 25 fed slices per 2 hours, the feeding table weights, the prize counts per raffle, the
# consolation rules and the milestone thresholds.
# GUESS: reference_participants. Hypixel draws a fixed number of prizes from a huge player base; we scale each
# raffle's prize counts by participants / reference_participants so a single player keeps roughly Hypixel's odds.
# GUESS: every prize inside a tier is equally likely (Hypixel refused to publish the odds).
online_ticket_minutes: 15
join_tickets: 3
fed_slices_per_period: 25

raffles:
  SPEED:
    reference_participants: 100000
    prizes: { MAJOR: 5, MEDIUM: 100, MINOR: 15000 }
  DAILY:
    reference_participants: 400000
    prizes: { MAJOR: 50, MEDIUM: 500, MINOR: 75000 }
  BIG_ONE:
    reference_participants: 1000000
    prizes: { MAJOR: 500, MEDIUM: 5000, MINOR: 500000 }

