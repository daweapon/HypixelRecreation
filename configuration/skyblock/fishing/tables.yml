  # The Crimson Isle lava pool (wiki: Sea_Creatures/List/Crimson_Isle): Sea Creature Chance is rolled once, then
  # one of the 9 island-wide creatures is picked by weight. Thunder needs Novice and Lord Jawbus Adept Trophy Fisher.
