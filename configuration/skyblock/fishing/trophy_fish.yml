# The 18 Trophy Fish (wiki: Trophy_Fish, Odger/Filleting_Rewards), in Odger's menu order.
# id is the save key in the player's trophy data; itemStem is Hypixel's item id stem (<stem>_BRONZE ...).
# catchChance is the base % before Trophy Chance; rarest eligible fish roll first.
trophyFish:
  - id: SULPHUR_SKITTER
    displayName: Sulphur Skitter
    itemStem: SULPHUR_SKITTER
    rarity: COMMON
    catchChance: 30
    filletMagmafish: [40, 60, 80, 120]
    conditions:
      - type: NEAR_BLOCK
        blocks: [sponge, wet_sponge]
        radius: 4
        from: PLAYER
  - id: OBFUSCATED_1
    displayName: Obfuscated-1
    itemStem: OBFUSCATED_FISH_1
    rarity: COMMON
    catchChance: 25
    filletMagmafish: [16, 24, 32, 48]
    conditions:
      - type: BAIT
        baits: [CORRUPTED_BAIT]
  - id: STEAMING_HOT_FLOUNDER
    displayName: Steaming-Hot Flounder
    itemStem: STEAMING_HOT_FLOUNDER
    rarity: COMMON
    catchChance: 20
    filletMagmafish: [20, 28, 40, 60]
    conditions:
      - type: REGIONS
        regions: [BLAZING_VOLCANO, ODGERS_HUT, PLHLEGBLAST_POOL, MAGMA_CHAMBER]
      - type: NEAR_GEYSER
        radius: 2
  - id: GUSHER
    displayName: Gusher
    itemStem: GUSHER
    rarity: COMMON
    catchChance: 20
    filletMagmafish: [32, 48, 64, 96]
    conditions:
      - type: REGIONS
        regions: [BLAZING_VOLCANO, ODGERS_HUT, PLHLEGBLAST_POOL, MAGMA_CHAMBER]
      - type: AFTER_ERUPTION
        minMinutes: 7
        maxMinutes: 16
  - id: BLOBFISH
    displayName: Blobfish
    itemStem: BLOBFISH
    rarity: COMMON
    catchChance: 25
    filletMagmafish: [4, 8, 12, 16]
    hint: Caught everywhere.
  - id: OBFUSCATED_2
    displayName: Obfuscated-2
    itemStem: OBFUSCATED_FISH_2
    rarity: UNCOMMON
    catchChance: 20
    filletMagmafish: [40, 60, 80, 120]
    conditions:
      - type: BAIT
        baits: [OBFUSCATED_FISH_1_BRONZE, OBFUSCATED_FISH_1_SILVER, OBFUSCATED_FISH_1_GOLD, OBFUSCATED_FISH_1_DIAMOND]
  - id: SLUGFISH
    displayName: Slugfish
    itemStem: SLUGFISH
    rarity: UNCOMMON
    catchChance: 15
    filletMagmafish: [40, 60, 80, 120]
    conditions:
      - type: MIN_BOBBER_SECONDS
        seconds: 20
  - id: FLYFISH
    displayName: Flyfish
    itemStem: FLYFISH
    rarity: UNCOMMON
    catchChance: 8
    filletMagmafish: [32, 48, 64, 96]
    conditions:
      - type: REGIONS
        regions: [BLAZING_VOLCANO, ODGERS_HUT, PLHLEGBLAST_POOL, MAGMA_CHAMBER]
      - type: BOBBER_BELOW_PLAYER
        blocks: 8
  - id: OBFUSCATED_3
    displayName: Obfuscated-3
    itemStem: OBFUSCATED_FISH_3
    rarity: RARE
    catchChance: 10
    filletMagmafish: [400, 700, 1000, 1300]
    conditions:
      - type: BAIT
        baits: [OBFUSCATED_FISH_2_BRONZE, OBFUSCATED_FISH_2_SILVER, OBFUSCATED_FISH_2_GOLD, OBFUSCATED_FISH_2_DIAMOND]
  - id: LAVAHORSE
    displayName: Lavahorse
    itemStem: LAVA_HORSE
    rarity: RARE
    catchChance: 4
    filletMagmafish: [12, 16, 20, 24]
    hint: Caught everywhere.
  - id: MANA_RAY
    displayName: Mana Ray
    itemStem: MANA_RAY
    rarity: RARE
    catchChance: 0
    manaScaled: true
    filletMagmafish: [40, 60, 80, 120]
    conditions:
      - type: MIN_MANA
        mana: 1200
  - id: VOLCANIC_STONEFISH
    displayName: Volcanic Stonefish
    itemStem: VOLCANIC_STONEFISH
    rarity: RARE
    catchChance: 4
    filletMagmafish: [20, 28, 40, 60]
    hint: Found in Blazing Volcano.
    conditions:
      - type: REGIONS
        regions: [BLAZING_VOLCANO, ODGERS_HUT, PLHLEGBLAST_POOL, MAGMA_CHAMBER]
  - id: VANILLE
    displayName: Vanille
    itemStem: VANILLE
    rarity: RARE
    catchChance: 8
    filletMagmafish: [80, 120, 160, 240]
    conditions:
      - type: STARTER_ROD_NO_ENCHANTMENTS
  - id: SKELETON_FISH
    displayName: Skeleton Fish
    itemStem: SKELETON_FISH
    rarity: EPIC
    catchChance: 2
    filletMagmafish: [32, 48, 64, 96]
    hint: Found in Burning Desert.
    conditions:
      - type: REGIONS
        regions: [BURNING_DESERT, DRAGONTAIL, DRAGONTAIL_AUCTION_HOUSE, DRAGONTAIL_BANK, DRAGONTAIL_BAZAAR,
                  DRAGONTAIL_BLACKSMITH, DRAGONTAIL_TOWNSQUARE, CHIEFS_HUT, MINION_SHOP]
  - id: MOLDFIN
    displayName: Moldfin
    itemStem: MOLDFIN
    rarity: EPIC
    catchChance: 2
    filletMagmafish: [32, 48, 64, 96]
    hint: Found in Mystic Marsh.
    conditions:
      - type: REGIONS
        regions: [MYSTIC_MARSH, SCARLETON, SCARLETON_AUCTION_HOUSE, SCARLETON_BANK, SCARLETON_BAZAAR,
                  SCARLETON_BLACKSMITH, SCARLETON_MINION_SHOP, SCARLETON_PLAZA, CATHEDRAL, SCARLETON_COMMUNITY_CENTER,
                  THRONE_ROOM, MAGE_COUNCIL]
  - id: SOUL_FISH
    displayName: Soul Fish
    itemStem: SOUL_FISH
    rarity: EPIC
    catchChance: 2
    filletMagmafish: [32, 48, 64, 96]
    hint: Found in Stronghold.
    conditions:
      - type: REGIONS
        regions: [STRONGHOLD]
  - id: KARATE_FISH
    displayName: Karate Fish
    itemStem: KARATE_FISH
    rarity: EPIC
    catchChance: 2
    filletMagmafish: [40, 60, 80, 120]
    conditions:
      - type: REGIONS
        regions: [DOJO]
  - id: GOLDEN_FISH
    displayName: Golden Fish
    itemStem: GOLDEN_FISH
    rarity: LEGENDARY
    catchChance: 0
    specialGoldenFish: true
    filletMagmafish: [400, 700, 1000, 1300]
