    rarity: LEGENDARY
    lore:
      - "\u00a77Consume to gain the \u00a7dCookie Buff \u00a77for"
      - "\u00a7b4 days\u00a77!"
      - ''
      - "\u00a78\u2023 \u00a77Ability to gain \u00a7bBits\u00a77!"
