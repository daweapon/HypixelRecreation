items:
  # BAT_FIREWORK/HORSEMAN_CANDLE: purchasable via the Fear Mongerer shop (Roadmap #19), NOT_FINISHED_YET
  # removed since they're now sold as real items - their real Hypixel right-click use behavior
  # (launching Bat Pinatas / summoning the Headless Horseman) is NOT implemented, since neither
  # Bat Pinatas nor a Headless Horseman boss mob exist in this codebase. A documented gap, not a
  # silent approximation - right-clicking these currently does nothing.
  - id: BAT_FIREWORK
    material: firework_rocket
    name: "Bat Firework"
    rarity: RARE
    lore:
      - "\xA77Launches a firework that"
      - "\xA77explodes into several Bat"
      - "\xA77Pi\xF1atas, each dropping a bunch"
      - "\xA77of candies. Only usable in the"
      - "\xA77\xA7bVillage\xA77."
      - ''
      - "\xA78Cooldown: \xA7a30s"
      - ''
      - "\xA77\xA78\xA7oBat Pi\xF1ata drops do not"
      - "\xA78\xA7ocount towards leaderboard"
      - "\xA78\xA7oprogress!"
    default_statistics: { }
    components:
      - id: SELLABLE
        value: 25000.0
  - id: BLAST_O_LANTERN
    material: player_head
    name: "Blast O Lantern"
    rarity: UNCOMMON
    lore:
      - "\xA77Throwable explosive. Deals \xA7a2"
      - "\xA7a\xA77damage to \xA76Spooky \xA77enemies"
      - "\xA77and \xA7c3,000 \xA77damage against"
      - "\xA77non-scary enemies!"
    default_statistics: { }
    components:
      - id: SKULL_HEAD
        texture: 68f2ffc6fb4e9959b9a7a317f51a6775a159ddc2241dbd6c774d3ac08b6
      - id: NOT_FINISHED_YET
      - id: DEFAULT_CRAFTABLE
        recipes:
          - type: SHAPED
            pattern:
              - AAA
              - ABA
              - AAA
            ingredients:
              A:
                type: GREEN_CANDY
                amount: 1
              B:
                type: PUMPKIN_GUTS
                amount: 1
            result:
              type: BLAST_O_LANTERN
              amount: 32
