  # Fear Mongerer candy shop (Roadmap #19) - real item list/prices sourced from the user's own
  # in-game tooltip screenshots, not the wiki (its shop table is image-rendered and didn't extract
  # via automated fetch). Placeholder skull textures reuse Green/Purple Candy's texture where no
  # real asset was available - flagged per item below.
  - id: TRICK_OR_TREAT_BAG
    material: player_head
    name: "Trick or Treat Bag"
    rarity: UNCOMMON
    lore:
      - "\xA77Picking up Candy will place it"
      - "\xA77directly into this bag! Your"
      - "\xA77Candy inventory is shared across"
      - "\xA77your profile - opening any Trick"
      - "\xA77or Treat Bag will display your"
      - "\xA77Candy inventory."
    default_statistics: { }
    components:
      - id: SKULL_HEAD
        texture: e31c0bd76a655d5d8fea5b06daaf1fb8d8060bf0823ebbc6eb6f99c8ee5a35aa
      - id: SELLABLE
        value: 1000.0
  - id: ECHOLOCATOR
    material: compass
    name: "Echolocator"
    rarity: UNCOMMON
    lore:
      - "\xA77When held during the \xA76Spooky"
      - "\xA77\xA76Festival\xA77, this compass points"
      - "\xA77towards the nearest \xA7cMega Bat"
      - "\xA77. Happy hunting!"
      - ''
      - "\xA78\xA7oReal Hypixel: points toward the"
      - "\xA78\xA7onearest Mega Bat. Not implemented"
      - "\xA78\xA7ohere - Mega Bat isn't a mob in"
      - "\xA78\xA7othis codebase yet."
    default_statistics: { }
