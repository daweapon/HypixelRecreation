items:
  - id: TOTEM_OF_CORRUPTION
    material: white_banner
    name: "Totem of Corruption"
    rarity: UNCOMMON
    lore:
      - "§8Fishing Deployable"
      - ""
      - "§aDeployable Buff: Corrupted"
      - "§a• §3Sea Creatures §7you fish up will be"
      - "§5Corrupted§7."
      - "§8Corrupted Sea Creatures may drop"
      - "§8an exclusive Trophy Fish."
      - ""
      - "§8Only one deployable can be active at"
      - "§8a time."
    components:
      - id: EXTRA_RARITY
        display: DEPLOYABLE
      - id: ABILITY
        abilities:
          - DEPLOY_TOTEM_OF_CORRUPTION
      - id: DEFAULT_CRAFTABLE
        default-craftable: false
        recipes:
          - type: SHAPED
            recipe-type: MINING
            pattern:
              - " A "
              - " A "
              - "BCB"
            ingredients:
              A:
                type: ENCHANTED_SULPHUR
                amount: 10
              B:
                type: MAGMA_CHUNK
                amount: 30
              C:
                type: CORRUPTED_FRAGMENT
                amount: 20
            result:
              type: TOTEM_OF_CORRUPTION
              amount: 1
