items:
  - id: IMPLOSION_SCROLL
    material: writable_book
    name: "Implosion Scroll"
    rarity: LEGENDARY
    lore:
      - <7>Apply to a Necron's Blade family
      - <7>weapon in an Anvil to permanently
      - <7>grant it the <c>Implosion <7>ability.
    components:
      - id: ANVIL_COMBINABLE
        handler_id: IMPLOSION_SCROLL
      - id: DEFAULT_CRAFTABLE
        recipes:
          - type: SHAPELESS
            recipe-type: SPECIAL
            ingredients:
              - type: WITHER_ARTIFACT
                amount: 1
              - type: ENCHANTED_DIAMOND_BLOCK
                amount: 1
            result:
              type: IMPLOSION_SCROLL
              amount: 1
