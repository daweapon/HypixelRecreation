# Heart of the Forest perks and abilities laid out as in real Hypixel: tier is the tree row (1 at the bottom), col the menu column (1-7).
# Cost to reach level N (N >= 2) = floor((N + offset) ^ exponent) whispers, or linearBase + linearSlope * N when linearBase is set; level 1 costs only the token.
# Effect value at level L = min(cap, base + perLevel * L). A perk marked available: false stays in the tree with its unavailable reason.
# desertWhispers: false charges Forest Whispers for the perks that real Hypixel prices in Desert Whispers (Torrhus Canyon is not built yet).
