# Kuudra's Hollow layout, read from the 2026-10-08 captures of real Burning and Infernal runs
# (.claude/kuudra-work/captures/{burning,infernal}); CAP marks values taken from them. Where the capture showed
# nothing the mods' waypoints are used (research K1 2.2, "K1"), and EST marks guesses.
# Positions are [x, y, z] or [x, y, z, yaw, pitch]; boxes are inclusive block bounds. Players stand at floor_y.

# Under configuration/world/ (the Infernal capture's world: platform, bridge, Kuudra's stomach and the lair cavity
# under the platform). While the file is missing, each run generates a placeholder arena from this layout.
world: kuudra_hollow.polar
floor_y: 79                         # CAP: the platform's top blocks are at Y 78
lava_surface_y: 75                  # CAP: lava fills Y 69-74

spawn: [-101.5, 79, -186.5, 180, 0]  # CAP: where the party enters, at the far end of the bridge
elle: [-101.5, 79, -175.5, 180, 0]   # CAP: Elle's "Talk with me to begin!" spot on the bridge
respawn: [-104.5, 79, -122.5, 180, 0] # EST: on the platform, south of the Ballista
ballista: [-102.5, 80, -106.5]       # CAP: the BALLISTA hologram; its blocks fill x -107..-99, z -111..-103

platform:                           # CAP: the central island's rough bounds
  min: [-137, 70, -136]
  max: [-65, 78, -70]
bridge:                             # CAP: the bridge blocks removed when Elle hooks Kuudra
  min: [-110, 75, -190]
  max: [-91, 82, -137]
sea:                                # CAP: the lava sea (Y 69-74)
  min: [-184, 69, -180]
  max: [-21, 74, -34]

# CAP: the six drop-off piles, which are also the Ballista build piles (named after the IQ waypoints they match).
piles:
  SHOP: [-98, 79, -112.94]
  TRIANGLE: [-94, 79, -106]
  EQUALS: [-106.03, 79, -99.09]
  SLASH: [-98.03, 79, -99.09]
  X_CANNON: [-110, 79, -106.03]
  X: [-106, 79, -112.94]

# The seven named spots (K1 pre-spots) where crates float in; one of them is empty each run. "crate" is where
# the crate floats (CAP where the capture saw one; otherwise it floats out in the lava past the platform edge).
supply_spots:
  TRIANGLE: {position: [-67.5, 77, -122.5], radius: 15, crate: [-58, 75, -124]}
  X: {position: [-142.5, 77, -151], radius: 30, crate: [-132, 75, -143]}
  EQUALS: {position: [-65.5, 76, -87.5], radius: 15}
  SLASH: {position: [-113.5, 77, -68.5], radius: 15}
  SHOP: {position: [-81, 76, -143], radius: 18}
  X_CANNON: {position: [-143, 76, -125], radius: 16, crate: [-133.5, 75, -115.5]}
  SQUARE: {position: [-143, 76, -80], radius: 20, crate: [-144.5, 75, -78.5]}

elle_platform: [-101.5, 79, -117.5, 180, 0]   # EST: Elle roams the platform near the piles during the fight
perk_shop: [-95.5, 79, -131]                  # CAP: the "Perk Shop" hologram
cannons:                                      # CAP: the two "CANNON" holograms
  - [-131, 79, -112, 90, 0]
  - [-70, 79, -103, -90, 0]
# Where Kuudra surfaces, by the side the mods name (RIGHT x < -128, FRONT z > -84, LEFT x > -72, BACK z < -132).
# CAP: the size-30 cubes rose at (-54, -108) (Infernal's first rise) and (-98, -59) (Burning's first rise), each about
# 47 blocks out from the Ballista. RIGHT and BACK mirror them across the Ballista, out in open lava; nothing spawns
# Kuudra before Elle hooks him.
kuudra_sides:
  FRONT: [-98, 75, -59]             # CAP
  LEFT: [-54, 75, -108]             # CAP
  RIGHT: [-151, 75, -108]           # EST: LEFT mirrored
  BACK: [-98, 75, -154]             # EST: FRONT mirrored, where the bridge stood before it collapsed

# CAP: where wave minions appeared in both captures, just under the lava past the platform edge; they jump out onto
# the platform from here (positions in open lava only; spawns under the rock overhangs are left out).
minion_spawns:
  - [-90, 74, -67]
  - [-119, 74, -70]
  - [-117, 74, -63]
  - [-76, 74, -75]
  - [-62, 74, -108]
  - [-67, 74, -127]
  - [-81, 74, -141]
  - [-95, 74, -145]
  - [-114, 74, -143]
  - [-132, 74, -143]
  - [-133, 74, -115]
  - [-140, 74, -117]
  - [-149, 74, -89]

# EST: the Forgotten Skull on the Crimson Isle, next to Crag, where players return after a run.
exit: [-372.5, 114, -1038.5, 180, 0]

# Kuudra's stomach (Burning and up), a cave far under the platform. It is already built in the captured world.
stomach:
  landing: [-160.5, 22, -168.5, 90, 0]   # EST: on the red glass floor between the pods (nobody in our party was eaten)
  elle: [-152.9, 22, -167.0, 10, 0]      # CAP: where Elle stood after being eaten
  throat: [-161.5, 49, -186.5]           # K1 (IQ's entry waypoint): the top of his throat; climbing here gets you out
  bounds:                                # CAP: the cave
    min: [-180, 14, -192]
    max: [-140, 57, -145]
  pods:                                  # CAP: the three purple pods (magenta terracotta and glass around a lava core)
    RIGHT:
      min: [-170, 24, -169]
      max: [-168, 29, -165]
    LEFT:
      min: [-154, 24, -173]
      max: [-150, 31, -170]
    BACK:
      min: [-156, 25, -157]
      max: [-154, 33, -153]
  bacteria:                              # CAP: where Magma Bacteria stood
    - [-153.5, 22, -164.5]
    - [-162.5, 22, -159.5]

# Kuudra's lair (Infernal), the cavity under the platform that opens at 25%. lair_collapse.yml lists the captured
# blocks that fall away.
lair:
  floor_y: 6                             # CAP: players stood at Y 6 in the pit
  bounds:                                # CAP: the cavity under the 2-block platform slab
    min: [-128, 5, -134]
    max: [-78, 76, -80]
  landing: [-101.5, 6, -105.5, 180, 0]   # CAP: where players landed after dropping in
  sides:                                 # CAP (SOUTH EST): where his head pokes out of the pit walls
    WEST: [-132, 9, -105]
    EAST: [-75, 12, -104]
    NORTH: [-98, 13, -136]
    SOUTH: [-98, 13, -77]
