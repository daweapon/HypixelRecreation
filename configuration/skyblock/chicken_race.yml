# Gulliver's Chicken Race course in Jerry's Workshop.
#
# The wiki gives no hoop positions, chicken speed or timer values, so this course is our own: it was
# routed around the island with every hoop and the straight line between hoops at least 4 blocks
# above the terrain in hypixel_skyblock_jerrys_workshop.polar. Retune freely - the server reads this
# file on startup. Hoops are flown in order; a missed hoop blocks the next one.
#
# At the default speed of 10 blocks/s the shortest line reaches the cluckpoints in about
# 26s / 44s / 60s / 91s, against Hypixel's limits of 33s / 52s / 68s / 104s.

speed: 10.0              # blocks per second, in the direction the rider is looking
starting_seconds: 20     # time on the countdown when the race starts
green_hoop_seconds: 5    # time added by a green hoop
cluckpoint_seconds: 10   # time added by a cluckpoint the player has already claimed
hoop_radius: 3.0

start: { x: 66.5, y: 109, z: 33.5, yaw: 95 }
finish: { x: 66.5, y: 105, z: 33.5, yaw: -90 }

# green: true adds time; cluckpoint: N marks Cluckpoint N (1-4, in order).
