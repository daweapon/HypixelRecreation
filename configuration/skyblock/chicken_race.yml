# Gulliver's Chicken Race course in Jerry's Workshop.
#
# The 31 hoops and the finish were traced from Hypixel gameplay footage (Boshunter, 2019-12-19,
# https://www.youtube.com/watch?v=48Q9045qi7U) from the player's coordinates as each hoop counted, so
# every centre is good to about 2 blocks. Each ring faces along the flight line traced through it
# (yaw/pitch, Minecraft convention). Hoops 5, 7, 17, 23 and 24 were nudged up to 2 blocks so their
# rings, and the straight line from the previous hoop, stay clear of our island's terrain.
#
# The cluckpoints are the green time hoops (10, 17, 23) and the finish. The countdown starts at
# Cluckpoint 1's limit; a time hoop adds the gap to the next limit (+19, +16, +36 seconds).
# The server reads this file on startup.

physics:
  blocks_per_second: 8.0    # horizontal speed along the rider's facing
  flap_velocity: 0.9        # blocks/tick upwards when JUMP flaps
  gravity: 0.06             # blocks/tick per tick
  terminal_velocity: 0.75   # fastest fall, blocks/tick
  flap_cooldown_ticks: 20

hoop_radius: 3.5
launch_grace_ticks: 10      # ticks after the start before touching a block ends the race
tint:
  start_seconds: 12         # the screen starts turning pink with this much time left
  full_seconds: 7           # and is fully red from here

start: { x: 65.5, y: 106, z: 30.5, yaw: 90, pitch: 0 }
return: { x: 66.5, y: 106, z: 30.5, yaw: -35, pitch: 0 }   # on the start walkway, facing Gulliver

