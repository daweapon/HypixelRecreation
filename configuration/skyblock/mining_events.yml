# Dwarven Mines Mining Events (wiki Dwarven Mines/Events). Active and passive events run on a 20 minute cadence;
# only passive events run in the Crystal Hollows. Weights and the first-event delay are not published by Hypixel.
cadence_minutes: 20
first_event_minutes: 3
warning_seconds: 20

events:
  DOUBLE_POWDER:
    weight: 20
    duration_minutes: 20
  BETTER_TOGETHER:
    weight: 20
    duration_minutes: 20
  MITHRIL_GOURMAND:
    weight: 20
    duration_minutes: 10
  GOBLIN_RAID:
    weight: 20
    duration_minutes: 5
  RAFFLE:
    weight: 20
    duration_minutes: 3

better_together:
