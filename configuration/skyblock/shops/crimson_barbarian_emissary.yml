# Barbarian Emissary's "Barbarian Shop" in Dragontail (wiki Barbarian_Emissary/UI), in menu order.
# Barbarian Faction members only. Coin prices drop 5/10/15/20% at Friendly/Trusted/Honored/Hero
# Barbarian Reputation. The Thornleaf Scythe's base price is 100,000 (the UI page's 85,000 is a
# discounted screenshot). Kuudra Keys cost 2/4/16/40/80 Enchanted Red Sand (2024-11 changelog; the
# 2022 UI page's 6/20/60/120 is stale).
title: Barbarian Shop
slots: DEFAULT
priceModifier: barbarian_emissary
entries:
  - item: THORNLEAF_SCYTHE
    material: iron_hoe
    cost: { coins: 100000 }
  - item: KUUDRA_TIER_KEY
    name: "<9>Kuudra Key"
    material: player_head
    cost:
      coins: 200000
      items:
        ENCHANTED_RED_SAND: 2
        CORRUPTED_NETHER_STAR: 2
  - item: KUUDRA_HOT_TIER_KEY
    name: "<5>Hot Kuudra Key"
    material: player_head
    requires: { faction: BARBARIAN, reputation: 1000 }
    cost:
      coins: 400000
      items:
        ENCHANTED_RED_SAND: 4
        CORRUPTED_NETHER_STAR: 2
  - item: KUUDRA_BURNING_TIER_KEY
    name: "<5>Burning Kuudra Key"
    material: player_head
    requires: { faction: BARBARIAN, reputation: 3000 }
    cost:
      coins: 750000
      items:
        ENCHANTED_RED_SAND: 16
        CORRUPTED_NETHER_STAR: 2
  - item: KUUDRA_FIERY_TIER_KEY
    name: "<5>Fiery Kuudra Key"
    material: player_head
    requires: { faction: BARBARIAN, reputation: 7000 }
    cost:
      coins: 1500000
      items:
        ENCHANTED_RED_SAND: 40
        CORRUPTED_NETHER_STAR: 2
  - item: KUUDRA_INFERNAL_TIER_KEY
    name: "<6>Infernal Kuudra Key"
    material: player_head
    requires: { faction: BARBARIAN, reputation: 12000 }
    cost:
      coins: 3000000
      items:
        ENCHANTED_RED_SAND: 80
        CORRUPTED_NETHER_STAR: 2
