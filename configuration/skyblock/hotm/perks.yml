# Heart of the Mountain perks and abilities, laid out as on Hypixel: tier is the tree row (1 at the bottom), col the column (1-7).
# Cost to reach level N (N >= 2) = floor((N + offset) ^ exponent) in the perk's powder; level 1 costs only the token cost.
# Effect value at level L = min(cap, base + perLevel * L). verified: false marks entries whose name or position was not seen in
# a capture of real Hypixel (the cell is known, the perk is a best guess).
