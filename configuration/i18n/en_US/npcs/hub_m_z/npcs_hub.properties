# Hub NPCs M-Z workstream. Kept in its own file (merged into the npcs_hub subsystem) so it never
# conflicts with the A-L NPC translations.

# --- Maddox the Slayer ---
npcs_hub.maddox.dialogue.first_interaction.1=Do you thirst for adventure?
npcs_hub.maddox.dialogue.first_interaction.2=Do you wish to slay the mightiest beasts of the land?
npcs_hub.maddox.dialogue.first_interaction.3=Complete <dark_purple>Slayer Quests <white>and fight bosses to unlock exotic rewards!
npcs_hub.maddox.batphone.call_1.1=<aqua>✆ <white>Hello?
npcs_hub.maddox.batphone.call_2.1=<aqua>✆ <white>You again? What do you want this time?
npcs_hub.maddox.batphone.call_3.1=<aqua>✆ <white>Someone answers!
npcs_hub.maddox.batphone.call_4.1=<aqua>✆ <white>You hear the line pick up...
npcs_hub.maddox.batphone.call_5.1=<aqua>✆ <white>Hey, what do you need?
npcs_hub.maddox.batphone.call_6.1=<aqua>✆ <white>How does a lobster answer? Shello!

# --- Malik ---
npcs_hub.malik.dialogue.first_interaction.1=Hello.
npcs_hub.malik.dialogue.first_interaction.2=The <red>Catacombs <white>are an old maze under the island.
npcs_hub.malik.dialogue.first_interaction.3=Tunnels in the caves were created to bury victims of the Calamity.
npcs_hub.malik.dialogue.first_interaction.4=An <dark_red>evil force<white> took control of the graves.
npcs_hub.malik.dialogue.first_interaction.5=Corpses are raised into a <green>powerful army<white> fueled by pain, misery and anguish.
npcs_hub.malik.dialogue.first_interaction.6=Anyway!
npcs_hub.malik.dialogue.first_interaction.7=If you find gear inside, I can <yellow>upgrade<white> it for you!

# --- Mort ---
npcs_hub.mort.dialogue.first_interaction.1=Hey <gray>{0}<white>, welcome to <red>The Catacombs<white>!
npcs_hub.mort.dialogue.first_interaction.2=We hope you have a long stay!
npcs_hub.mort.dialogue.first_interaction.3=Preferably, an <gray><italic>eternal</italic><white> adventure.
npcs_hub.mort.dialogue.first_interaction.4=<dark_red>Our forces<white> are made of rotting adventurers.
npcs_hub.mort.dialogue.first_interaction.5=A <blue>party<white> of <yellow>5 players<white> is crucial.
npcs_hub.mort.dialogue.first_interaction.6=Time to make friends.
npcs_hub.mort.dialogue.low_combat.1=Wanderer!
npcs_hub.mort.dialogue.low_combat.2=Save your own skin, seek challenge elsewhere first.
npcs_hub.mort.dialogue.low_combat.3=<gray><italic>You need Combat Level XV before leading a dungeon.

# --- Ophelia ---
npcs_hub.ophelia.dialogue.first_interaction.1=These <red>Catacombs<white> hold many <yellow>riches<white>, powerful <green>items<white> and great <aqua>experience.
npcs_hub.ophelia.dialogue.first_interaction.2=My trick? I make <gold>coins<white> from the others' greed.
npcs_hub.ophelia.dialogue.first_interaction.3=Are you interested in buying anything?

# --- Marco ---
npcs_hub.marco.dialogue.quest_start.1=Hey there!
npcs_hub.marco.dialogue.quest_start.2=I'm a world-famous artist to be. Most people just call me "the new da Vinci".
npcs_hub.marco.dialogue.quest_start.3=Unfortunately I ran out of dye this morning...
npcs_hub.marco.dialogue.quest_start.4=In my garden are some flowers. Could you pick <yellow>5 Poppies <white>and turn them into <yellow>Rose Red Dye<white>, then bring them back to me?
npcs_hub.marco.dialogue.missing_items.1=Come back with the right amount of items!
npcs_hub.marco.dialogue.quest_complete.1=Wow! That's the most beautiful red dye I have ever seen!
npcs_hub.marco.dialogue.quest_complete.2=Take this Spray Can!
npcs_hub.marco.dialogue.quest_complete.3=You can select a spray by left-clicking your Spray Can!
npcs_hub.marco.dialogue.quest_complete.4=Right-click any wall on your private island to spray it. If you ever lose your Spray Can, you can craft another one using the recipe in your <green>Recipe Book<white>!
npcs_hub.marco.dialogue.quest_complete.5=Thank you so much for your help. You should visit me in my <aqua>Canvas Room <white>sometime! Step into the portal to the left over there!
npcs_hub.marco.dialogue.idle_1.1=Before spraying on a wall, consider previewing it in the menu! Right-click on any spray of your choice and it'll magically appear in your hand.
npcs_hub.marco.dialogue.idle_2.1=Don't forget to refill your spray can with dye! You can pick some of the flowers in my garden if you want to.
npcs_hub.marco.dialogue.idle_3.1=You can select sprays by left-clicking with your Spray Can!

# --- Ozanne ---
npcs_hub.ozanne.dialogue.hello.1=Did you know that for the longest time...
npcs_hub.ozanne.dialogue.hello.2=The Blacksmith would reforge your <green>accessories<white>?
npcs_hub.ozanne.dialogue.hello.3=<red>Crazy <white>stuff!
npcs_hub.ozanne.dialogue.hello.4=If you find <green>reforged accessories<white>, I'll buy their reforges from you for <gold>coins<white>!

# --- Scoop ---
npcs_hub.scoop.dialogue.open_shop.1=I love the snow!
npcs_hub.scoop.dialogue.open_shop.2=I've got the perfect tool to make your island a winter wonderland!

# --- Taylor ---
npcs_hub.taylor.dialogue.first_interaction.1=Hey there adventurer!
npcs_hub.taylor.dialogue.first_interaction.2=You look like someone who values <green>fashion <white>as much as fighting!
npcs_hub.taylor.dialogue.first_interaction.3=Want to <green>stand out <white>while you slash and dash?
npcs_hub.taylor.dialogue.first_interaction.4=Check out my cosmetic collection!

# --- Udium ---
npcs_hub.udium.dialogue.hello.1=<light_purple>Magic<white> is very <red>dangerous.
npcs_hub.udium.dialogue.hello.2=One second everything is fine and the next, the world is ending.
npcs_hub.udium.dialogue.hello.3=I was playing with a <dark_purple>Sculk Catalyst<white> in a different world from the future...
npcs_hub.udium.dialogue.hello.4=And the <dark_purple>sculk<white> spread all over my body!
npcs_hub.udium.dialogue.hello.5=Even <yellow>Alatar<white>, a powerful wizard...
npcs_hub.udium.dialogue.hello.6=He just disappeared one day!
npcs_hub.udium.dialogue.hello.7=Poof!
npcs_hub.udium.dialogue.hello.8=No more <yellow>Alatar<white>!

# --- Wizard ---
npcs_hub.wizard.dialogue.low_level.1=Oh...
npcs_hub.wizard.dialogue.low_level.2=I'm afraid crossing the portal would be a bit too <red>dangerous <white>for you.
npcs_hub.wizard.dialogue.low_level.3=Learn more about <italic>this</italic> world before thinking of visiting <light_purple>other <white>dimensions!
npcs_hub.wizard.dialogue.greeting.1=Greetings, traveler!
npcs_hub.wizard.dialogue.greeting.2=I can sense that you possess some <light_purple>magical prowess<white>, and I find myself in need of assistance.
npcs_hub.wizard.dialogue.greeting.3=The matter at hand is rather complex, but I shall be brief.
npcs_hub.wizard.dialogue.greeting.4=Are you interested in learning more?
npcs_hub.wizard.dialogue.declined.1=Very well, I shall seek help elsewhere!
npcs_hub.wizard.dialogue.breach.1=Excellent!
npcs_hub.wizard.dialogue.breach.2=You see, long ago a <dark_purple>breach <white>materialized atop the Mountain.
npcs_hub.wizard.dialogue.breach.3=Crossing through <dark_purple>it <white>is a daunting task, but not entirely impossible.
npcs_hub.wizard.dialogue.breach.4=The problem is... those who ventured through... never returned.
npcs_hub.wizard.dialogue.breach.5=I've dedicated much of my life to developing a <light_purple>portal <white>that allows <green>safe passage <white>between our world and this mysterious dimension.
npcs_hub.wizard.dialogue.succeeded.1=Indeed!
npcs_hub.wizard.dialogue.succeeded.2=With the invaluable help of my dear friend <blue>Barry<white>, we managed to create a functioning <light_purple>portal<white>.
npcs_hub.wizard.dialogue.succeeded.3=<blue>Barry <white>tested it himself and successfully returned.
npcs_hub.wizard.dialogue.succeeded.4=He now uh... <gold><italic>"studies"</italic> <white>the <light_purple>Rift <white>across.
npcs_hub.wizard.dialogue.why_not_you.1=<blue>Barry <white>informed me that an alternate version of <light_purple>myself <white>is <red>trapped <white>in that dimension, hailing from <dark_red>another <white>world.
npcs_hub.wizard.dialogue.why_not_you.2=According to the laws of causality, we must never meet, preventing me from crossing over.
npcs_hub.wizard.dialogue.why_not_you.3=Imagine that! After devoting my life to this project, I cannot use it!
npcs_hub.wizard.dialogue.need_you.1=I have a reason to believe that a <dark_red>catastrophic event <white>looms in our world's future.
npcs_hub.wizard.dialogue.need_you.2=Unraveling the mysteries of the <light_purple>Rift <white>could prove crucial to our survival.
npcs_hub.wizard.dialogue.need_you.3=We need all the help we can muster, and you appear to be <italic>quite talented</italic>.
npcs_hub.wizard.dialogue.infusion.1=<italic>Splendid</italic>.
npcs_hub.wizard.dialogue.infusion.2=All you need is a <light_purple>Dimensional Infusion<white>...
npcs_hub.wizard.dialogue.infusion.3=... then you can safely travel across.
npcs_hub.wizard.dialogue.infusion.4=I can apply it to you every few hours, otherwise you will need to bring me <aqua>enchanting orbs<white>.

# --- Richard ---
npcs_hub.richard.dialogue.no_diaz.1=...
npcs_hub.richard.dialogue.no_diaz.2=Can't you see I'm busy?
npcs_hub.richard.dialogue.no_diaz.3=Oh, you can't?
npcs_hub.richard.dialogue.no_diaz.4=Whatever. Go talk to <green>Liz<white>, she'll tell you what's up.
npcs_hub.richard.dialogue.diaz.1=Hey hey heyyy!
npcs_hub.richard.dialogue.diaz.2=I'm <green>Richard<white>, the <light_purple>Stonks Auction Master<white>.
npcs_hub.richard.dialogue.diaz.3=As long as <gold>Diaz <white>is Mayor, I'll let you bid on <dark_purple>Stock of Stonks <white>to use in <green>Liz<white>'s shop!
npcs_hub.richard.dialogue.diaz.4=<italic>It's kind of a big deal.

# --- Zarina ---
npcs_hub.zarina.dialogue.first_interaction.1=Have you ever wanted to change fate?
npcs_hub.zarina.dialogue.first_interaction.2=Unsay something you shouldn't've, undo a mistake you've made?
npcs_hub.zarina.dialogue.first_interaction.3=Well, I can't help you do any of that, but I <italic>can</italic> increase the amount of <gold>Coins <white>paid on <gold>Midas <white>weapons so you can harness their maximum <red>❁ Damage <white>bonus.
npcs_hub.zarina.dialogue.first_interaction.4=And really, isn't that practically the next-best thing?

# --- Vincent ---
npcs_hub.vincent.dialogue.low_level.1=Hmm. I don't know if you've been here long enough to appreciate my artistry.
npcs_hub.vincent.dialogue.low_level.2=Maybe come back when you have <green>SkyBlock Level 10<white>!
npcs_hub.vincent.dialogue.introduction.1=Hello there. My name is <aqua>Vincent<white>.
npcs_hub.vincent.dialogue.introduction.2=I'm an artist. I believe you may be familiar with others, such as Marco and Pablo.
npcs_hub.vincent.dialogue.introduction.3=Let me ask you a question - have you ever heard of <red>d<gold>y<yellow>e<green>s<white>?
npcs_hub.vincent.dialogue.knows_dyes.1=Very good, then I don't need to explain what they're used for.
npcs_hub.vincent.dialogue.knows_dyes.2=However, I should probably give you some tips on how to get them...
npcs_hub.vincent.dialogue.explain_dyes.1=For someone like you, <red>d<gold>y<yellow>e<green>s <white>can be used to turn any kind of armor a certain color.
npcs_hub.vincent.dialogue.explain_dyes.2=You can apply them in an anvil alongside any piece of armor, and it will recolor it!
npcs_hub.vincent.dialogue.explain_dyes.3=Though it's worth noting that this will consume the dye, meaning you won't get it back afterwards.
npcs_hub.vincent.dialogue.explain_dyes.4=They don't call it a consumable for nothing!
npcs_hub.vincent.dialogue.painting.1=As a painter, I prefer to use <red>d<gold>y<yellow>e<green>s <white>as part of my work.
npcs_hub.vincent.dialogue.painting.2=Dyes drop from a variety of different parts of SkyBlock and are <red>extremely rare<white>, so most artists just go with the flow and work with what they have.
npcs_hub.vincent.dialogue.painting.3=However, I feel like I'm... different. Depending on what I'm painting, I need different types of dyes, but I <gold><bold>always</bold><white> find <gold><bold>exactly what I need</bold><white>!
npcs_hub.vincent.dialogue.painting.4=<italic>It's almost as if the dyes I use become more common for everyone...
npcs_hub.vincent.dialogue.painting.5=Nah, that would be CRAZY.
npcs_hub.vincent.dialogue.painting.6=Anyways, if you ever want to see what I'm currently painting, come speak to me again!
npcs_hub.vincent.dialogue.open_1.1=Look! I can paint with all the colors of the rainbow!
npcs_hub.vincent.dialogue.open_2.1=I'm working on a masterpiece currently. Want to take a look?
npcs_hub.vincent.dialogue.open_3.1=This piece is really starting to shape up.

# --- Apprentice ---
npcs_hub.apprentice.dialogue.furniture.1=The <green>Furniture Shop<white> has many different kinds of cool furniture for you to put in your world!
npcs_hub.apprentice.dialogue.furniture.2=For a price, you can buy it here!
npcs_hub.apprentice.dialogue.learning.1=I'm still learning carpentry. I learn the most when crafting enchanted items!
npcs_hub.apprentice.dialogue.talk_to_carpenter.1=Talk to the Carpenter upstairs to learn more about <green>Carpentry<white>!
npcs_hub.apprentice.dialogue.wool_hint.1=Looking for wool? Try the <yellow>Mushroom Desert<white>!

# --- Plumber Joe ---
npcs_hub.plumber_joe.dialogue.hello.1=Water troubles? No problem!
